<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臺北資料夾 File in Taipei 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@300;400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff;--navy:#224c88;--mag:#c63079;--mag-s:#cb5993;--line:#a6d6dc;--line-d:#5fb3bd;--asc:#a4d0d1;--lav:#908dc4;--ink:#221815;--grey:#575959;
  --sky:#95d3ed;--orange:#ef7d3c;--peri:#8ea9df;--lavender:#b5b5d6;--mint:#a3cbb4;--yellow:#f2e68c;--pink:#f3c5d9;--green:#2f7a55;--duo-l:#f1c6e1;
  --f-lat:"Alegreya","Noto Sans TC",serif;--f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--f-asc:"Jost","Noto Sans TC",sans-serif;--f-tag:"LXGW WenKai TC","Noto Sans TC",serif;
  --gut:clamp(16px,4vw,56px);--ease:cubic-bezier(.7,0,.2,1);--spring:cubic-bezier(.3,1.6,.4,1);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-zh);line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
[lang=en]{font-family:var(--f-lat)}
::selection{background:var(--mag);color:#fff}
:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
#ascii{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}

/* ── 頂列 ── */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:20px;height:68px;padding:0 var(--gut);pointer-events:none}
.bar>*{pointer-events:auto}
.logo{display:flex;align-items:baseline;gap:10px;color:var(--navy);background:rgba(255,255,255,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 10px 6px 0}
.logo b{font:500 23px/1 var(--f-lat)}
.logo span{font:500 12px/1 var(--f-zh);letter-spacing:.24em;color:var(--mag)}
.coord{margin-left:auto;font:300 10.5px/1 var(--f-asc);letter-spacing:.24em;color:var(--lav);white-space:nowrap}
.nav{display:flex;gap:6px}
.nav a{display:flex;align-items:baseline;gap:7px;font:400 11px/1 var(--f-asc);letter-spacing:.22em;text-transform:uppercase;color:var(--navy);padding:11px 15px 10px;border:1.5px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px 12px 2px 2px;transition:background .3s,color .3s,border-color .3s}
.nav a b{font:500 13px/1 var(--f-zh);letter-spacing:.12em}
.nav a:hover,.nav a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.burger{display:none;margin-left:auto;font:400 11px/1 var(--f-asc);letter-spacing:.24em;color:var(--navy);padding:11px 14px;border:1.5px solid var(--line);background:#fff;border-radius:12px 12px 2px 2px}
@media (max-width:820px){.coord,.nav{display:none}.burger{display:block}.logo b{font-size:20px}}
.menu{position:fixed;inset:0;z-index:45;background:var(--paper);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:90px var(--gut) 40px;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .7s var(--ease),visibility 0s .7s}
.menu.open{clip-path:inset(0);visibility:visible;transition:clip-path .7s var(--ease)}
.menu a{position:relative;z-index:1;font:500 clamp(46px,13vw,80px)/1 var(--f-lat);color:var(--navy)}
.menu a small{display:block;font:500 15px/1.6 var(--f-zh);letter-spacing:.32em;color:var(--mag)}
.menu .mstrips{position:absolute;right:0;top:0;bottom:0;width:34%;display:flex;gap:3px}
.menu .mstrips i{flex:1;background:var(--g);position:relative}
.menu .mfoot{position:relative;z-index:1;font:300 11px/1.8 var(--f-asc);letter-spacing:.18em;color:var(--lav);margin-top:30px}

/* ── 首頁主視覺 ── */
/* 首屏固定住的捲動距離＝高度減一個螢幕：電腦 40%、手機 35% 個螢幕高，約一次滑動開合完 */
.hero{position:relative;height:140vh}
.hero-stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.hero-3d{position:absolute;inset:0}
.hero-3d canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.hero-3d.gl .ffan{display:none}
.ffan{position:absolute;right:12%;bottom:12%;width:30vw;height:62vh}
.ffan i{position:absolute;left:50%;bottom:0;width:22%;height:100%;transform-origin:50% 100%;border:1.5px solid var(--line);background:var(--g)}
.ffan i::after,.sgrain,.duo::before{content:'';position:absolute;inset:0;background:var(--grain);mix-blend-mode:multiply;opacity:.32;pointer-events:none}
.hero-title{position:absolute;left:var(--gut);top:clamp(96px,15vh,170px);z-index:3;color:var(--navy);pointer-events:none;will-change:transform,opacity}
.yr{font:700 clamp(24px,2.6vw,42px)/1 var(--f-lat);color:var(--mag-s);letter-spacing:.04em;margin-left:.06em}
.wm{margin:.08em 0 0;font:500 clamp(74px,10.4vw,196px)/.9 var(--f-lat);letter-spacing:-.004em}
.wm .ln{display:block}
.wm .in{display:inline-grid;place-items:center;width:1.04em;height:1.04em;border:.035em solid var(--mag-s);border-radius:50%;font-size:.6em;color:var(--mag-s);margin:.14em 0 .12em .2em;line-height:1;background:rgba(255,255,255,.7)}
.wm .in span{transform:translateY(-.06em)}
.lt{display:inline-block;pointer-events:auto;transition:transform .6s var(--spring),color .3s,text-shadow .3s}
.lt.hit{color:var(--mag);text-shadow:.045em .03em 0 rgba(149,211,237,.95)}
.hero-sub{margin-top:clamp(20px,3.4vh,40px);max-width:30em}
.hero-sub .zh{font:500 clamp(13px,1.1vw,17px)/1.7 var(--f-zh);color:var(--mag);letter-spacing:.16em}
.hero-sub .en{font:500 clamp(16px,1.45vw,23px)/1.3 var(--f-lat);color:var(--mag);margin-top:4px}
.hero-sub .dt{font:300 11.5px/1 var(--f-asc);letter-spacing:.28em;color:var(--navy);margin-top:16px}
.bez{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:4}
.bez path{fill:none;stroke:var(--mag-s);stroke-width:2}
.hdl{position:absolute;left:0;top:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border:2px solid var(--mag-s);background:#fff;z-index:5;cursor:grab;touch-action:none;pointer-events:auto}
.hdl::after{content:'';position:absolute;inset:-16px}
.hdl.dragging{cursor:grabbing;background:var(--mag-s)}
.vtag{position:absolute;left:0;top:0;z-index:3;transform-origin:0 0;writing-mode:vertical-rl;background:#fff;border:1.5px solid var(--line);font-family:var(--f-tag);line-height:1;will-change:transform;pointer-events:none}
.vtag.big{font-weight:700;font-size:clamp(34px,min(3.9vw,6.4vh),74px);color:var(--navy);letter-spacing:.06em;padding:.32em .2em}
.vtag.s{font-size:clamp(14px,min(1.3vw,2.2vh),22px);color:var(--mag);letter-spacing:.1em;padding:.5em .3em}
.vtag .sq,.h,.vh{position:absolute;width:10px;height:10px;border:1.5px solid var(--line);background:#fff}
.vtag .sq{right:-6px;top:-6px}
.vh{left:0;top:0;margin:-5px 0 0 -5px;z-index:2;pointer-events:none}
.hash{position:absolute;z-index:3;font:500 italic clamp(15px,1.4vw,22px)/1 var(--f-zh);color:var(--grey);letter-spacing:.02em;white-space:nowrap}
button.hash:hover{color:var(--mag)}
.h-acc{left:52%;top:62%}.h-sha{left:57%;bottom:15%}
.h-edit{left:0;top:0;pointer-events:none;color:var(--mag-s);font-size:13px}
.checker{position:absolute;right:6%;top:52%;z-index:3;font:700 clamp(110px,11vw,190px)/1 var(--f-asc);color:transparent;background:repeating-conic-gradient(#2a2a2a 0 25%,#fff 0 50%) 0 0/9px 9px;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.5px #2a2a2a;user-select:none}
.blob{position:absolute;left:4%;bottom:7%;z-index:3;width:clamp(92px,9vw,150px);user-select:none}
.drag{cursor:grab;touch-action:none}
.drag:active{cursor:grabbing}
.hud{position:absolute;left:var(--gut);right:var(--gut);bottom:20px;display:flex;justify-content:space-between;gap:20px;font:300 10.5px/1.5 var(--f-asc);letter-spacing:.24em;color:var(--navy);z-index:3;pointer-events:none}
.hud .sc{animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:820px){
  .hero{height:135vh}
  .hero-title{top:96px}
  .wm{font-size:clamp(64px,19vw,110px)}
  .hero-sub{max-width:80vw}
  /* 手機上桃紅字各拆兩行：臺北市／國內外青年藝術家交流計畫；英文在 Residency 前換行 */
  .hero-sub .zh span{display:block}
  .hero-sub .en{max-width:15.5em}
  .h-acc{left:8%;right:auto;top:auto;bottom:20%}.h-sha{left:8%;bottom:13%}
  .checker{right:4%;top:38%;font-size:84px}
  .blob{left:auto;right:30%;bottom:6%;width:72px}
  .hud span:first-child{display:none}
  #tagA,#tagB{display:none}
}

/* ── 數字列 ── */
.stats{position:relative;display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:24px;align-items:end;padding:clamp(70px,12vh,130px) var(--gut) 20px}
.path{font:300 12px/2 var(--f-asc);letter-spacing:.2em;color:var(--lav);align-self:start}
.stat{display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--navy);border-top:1.5px solid var(--line);padding-top:14px}
.stat b{font:400 clamp(64px,8vw,132px)/.9 var(--f-lat);letter-spacing:-.02em;font-variant-numeric:lining-nums}
.stat b.d{font-size:clamp(26px,2.6vw,42px);line-height:1.1;letter-spacing:0}
.stat span{font:500 14px/1.6 var(--f-zh);letter-spacing:.16em;margin-top:8px}
.stat span em{font:italic 500 16px var(--f-lat);letter-spacing:0;color:var(--mag);margin-left:4px}
button.stat:hover b{color:var(--mag)}
@media (max-width:820px){.stats{grid-template-columns:1fr 1fr}.path{grid-column:1/-1}.stat.dates{grid-column:1/-1}}

/* ── 區段標頭 ── */
/* 內容區蓋一層半透明白，背景字元只在左右邊緣露出，像海報 */
.sec,.stats,.page{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.86) 9%,rgba(255,255,255,.86) 91%,rgba(255,255,255,0))}
.sec{position:relative;padding:clamp(80px,13vh,150px) var(--gut) clamp(40px,8vh,90px)}
.sh{position:relative;display:flex;align-items:flex-end;gap:18px;border-bottom:1.5px solid var(--line);padding-bottom:16px;margin-bottom:10px}
.sh .k{position:absolute;left:0;top:-30px;font:300 11.5px/1 var(--f-asc);letter-spacing:.26em;color:var(--lav)}
.sh h2{margin:0;font:700 clamp(34px,4.4vw,64px)/1 var(--f-zh);color:var(--navy);letter-spacing:.08em}
.sh h2 em{font:italic 500 .78em var(--f-lat);color:var(--mag);margin-left:.35em;letter-spacing:0}
.sh .n{margin-left:auto;font:300 clamp(34px,4.4vw,64px)/1 var(--f-asc);color:var(--line);letter-spacing:.06em}

/* ── 藝術家清單 ── */
.alist{list-style:none;margin:0;padding:0;position:relative}
.arow{display:grid;grid-template-columns:72px minmax(0,1.5fr) minmax(0,1fr) 110px;align-items:baseline;gap:18px;padding:20px 0 18px;border-bottom:1px dashed var(--line);color:var(--navy);position:relative;background:rgba(255,255,255,.72)}
.aid{font:300 11.5px/1 var(--f-asc);letter-spacing:.24em;color:var(--lav)}
.anm{font:500 clamp(34px,4.6vw,78px)/1.02 var(--f-lat);transition:transform .6s var(--spring),color .3s,text-shadow .3s;transform-origin:0 50%;overflow-wrap:anywhere}
.arow:hover .anm,.arow:focus-visible .anm{transform:translateX(.22em) skewX(-6deg);color:var(--mag);text-shadow:.035em .025em 0 rgba(149,211,237,.95)}
.ant{font:400 14px/1.45 var(--f-zh);color:var(--ink)}
.ant [lang=en]{display:block;color:var(--grey);font-size:15.5px}
.ayr{font:300 11px/1.9 var(--f-asc);letter-spacing:.2em;text-align:right;color:var(--navy)}
.ath{display:none}
@media (max-width:820px){
  .arow{grid-template-columns:78px minmax(0,1fr);gap:4px 16px;align-items:center;padding:16px 0}
  .ath{display:block;grid-row:1/span 4;width:78px;height:78px;border-radius:50%}
  .anm{font-size:clamp(30px,9vw,44px)}
  .ayr{text-align:left}
}
.afloat{position:fixed;left:0;top:0;z-index:40;width:clamp(210px,19vw,300px);pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
.afloat.on{opacity:1}
.afloat .duo{aspect-ratio:1;border:1.5px solid var(--line)}
.afloat .h{width:9px;height:9px;border-color:var(--line-d)}
.afloat .atag{position:absolute;left:-1.5px;top:100%;margin-top:6px;background:#fff;border:1.5px solid var(--line);font:300 10px/1 var(--f-asc);letter-spacing:.2em;color:var(--navy);padding:6px 8px;white-space:nowrap}
.h.tl{left:-5px;top:-5px}.h.tr{right:-5px;top:-5px}.h.bl{left:-5px;bottom:-5px}.h.br{right:-5px;bottom:-5px}

/* 雙色調：暗部綠、亮部粉，像主視覺裡那張顆粒照片 */
.duo{display:block;position:relative;overflow:hidden;background:var(--duo-l);isolation:isolate}
.duo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.12) brightness(1.04);mix-blend-mode:multiply;transition:filter .7s}
.duo::after{content:'';position:absolute;inset:0;background:var(--green);mix-blend-mode:lighten;transition:opacity .7s;pointer-events:none}
.duo::before{z-index:2;opacity:.42}
.duo.color img{filter:none;mix-blend-mode:normal}
.duo.color::after{opacity:0}
.nopic{display:grid;place-items:center;width:100%;height:100%;font:500 clamp(40px,6vw,90px)/1 var(--f-lat);color:var(--navy);background:var(--g)}
.duo.nophoto{background:none}.duo.nophoto::after{display:none}

/* ── 作品頁條 ── */
.shelf{display:flex;gap:5px;height:min(78vh,760px);margin-top:28px}
.strip{position:relative;flex:1 1 0;min-width:0;overflow:hidden;background:var(--g);border:1.5px solid var(--line);border-radius:3px 16px 3px 3px;transition:flex-grow .8s var(--ease);color:var(--navy)}
.strip.on{flex-grow:7.5}
@media (min-width:821px){
  .strip.peek{flex-grow:2.1;transition-duration:.55s}
  .strip.peek .slab{transform:translateX(-50%) rotate(-7deg)}
}
.sband{position:absolute;left:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(0deg,var(--green) 0 2px,var(--duo-l) 2px 3px);opacity:.85;-webkit-mask:var(--grain);mask:var(--grain);-webkit-mask-size:120px;mask-size:120px}
.sid{position:absolute;left:12px;top:12px;font:300 10.5px/1 var(--f-asc);letter-spacing:.2em;background:#fff;border:1.5px solid var(--line);padding:5px 6px;z-index:2}
.slab{position:absolute;left:50%;top:56px;transform:translateX(-50%) rotate(-3deg);writing-mode:vertical-rl;background:#fff;border:1.5px solid var(--line);font:700 clamp(14px,1.3vw,20px)/1 var(--f-tag);letter-spacing:.12em;padding:.6em .35em;max-height:calc(100% - 110px);overflow:hidden;transition:opacity .4s,transform .6s var(--spring);white-space:nowrap}
.slab.lat{font:500 clamp(14px,1.25vw,19px)/1 var(--f-lat);letter-spacing:.02em}
.strip.on .slab{opacity:0;transform:translateX(-50%) rotate(-12deg) scale(.9)}
.sopen{position:absolute;left:clamp(16px,2.4vw,40px);right:clamp(16px,2.4vw,40px);bottom:clamp(16px,3vh,36px);display:flex;flex-direction:column;align-items:flex-start;gap:10px;opacity:0;transform:translateY(24px);transition:opacity .35s,transform .7s var(--ease);pointer-events:none}
.strip.on .sopen{opacity:1;transform:none;transition-delay:.25s}
.sk{font:300 10.5px/1 var(--f-asc);letter-spacing:.24em;background:#fff;border:1.5px solid var(--line);padding:6px 8px}
.stt{background:#fff;border:1.5px solid var(--line);padding:.18em .32em .22em;font:700 clamp(26px,3.2vw,52px)/1.15 var(--f-zh);letter-spacing:.04em;max-width:100%}
.stt.lat{font:500 clamp(28px,3.4vw,56px)/1.05 var(--f-lat);letter-spacing:0}
.sst{background:#fff;padding:.15em .4em;font:italic 500 clamp(16px,1.5vw,22px)/1.25 var(--f-lat);color:var(--mag);max-width:100%}
.sar,.smd{background:rgba(255,255,255,.9);padding:4px 8px;font:400 13.5px/1.5 var(--f-zh);max-width:100%}
.sgo{font:400 11px/1 var(--f-asc);letter-spacing:.24em;color:#fff;background:var(--navy);padding:10px 14px;margin-top:6px}
.strip:hover .sgo{background:var(--mag)}
@media (max-width:820px){
  .shelf{flex-direction:column;height:auto;gap:5px}
  .strip{flex:none;height:74px;transition:height .7s var(--ease);border-radius:3px 3px 3px 16px}
  .strip.on{height:min(78vh,440px)}
  /* 編號框與作品名橫排，作品名接在編號框後面，編號多了 ▶ 也不會蓋到 */
  .strip{display:flex;align-items:center;gap:10px;padding:0 14px 0 26px}
  .strip.on{align-items:flex-start;padding-top:12px}
  .strip .sid{position:relative;left:auto;top:auto;flex:none}
  .strip .slab{position:relative;left:auto;top:auto;flex:0 1 auto;min-width:0;writing-mode:horizontal-tb;transform:rotate(-1.5deg);max-height:none;padding:.4em .5em;text-overflow:ellipsis}
  .strip.on .slab{transform:rotate(-6deg) scale(.9)}
}

/* ── 頁尾 ── */
.foot{position:relative;z-index:1;margin-top:60px;border-top:1.5px solid var(--line);background:#fff;overflow:hidden;padding:0 0 26px}
.mq{display:flex;width:max-content;white-space:nowrap;padding:34px 0 18px;font:500 clamp(64px,12vw,210px)/1 var(--f-lat);color:transparent;-webkit-text-stroke:1.5px var(--line);animation:mq 38s linear infinite}
.mq span{padding-right:.4em}
.mq em{font-style:normal;font-family:var(--f-tag);font-weight:700;-webkit-text-stroke:1.5px var(--mag-s);font-size:.62em;vertical-align:.18em;padding:0 .3em}
@keyframes mq{to{transform:translateX(-50%)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;padding:10px var(--gut) 30px;font:400 14px/1.7 var(--f-zh);color:var(--navy)}
.fgrid [lang=en]{display:block;color:var(--grey);font-size:15px}
.fend{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 var(--gut);font:300 11px/1 var(--f-asc);letter-spacing:.26em;color:var(--lav)}
.totop{font:500 22px/1 var(--f-asc);color:var(--navy);border:1.5px solid var(--line);padding:9px 13px;letter-spacing:.1em;transition:transform .5s var(--spring)}
.totop:hover{transform:rotate(-90deg);color:var(--mag)}
@media (max-width:820px){.fgrid{grid-template-columns:1fr}}

/* ── 內頁共用 ── */
.page{position:relative;padding:120px var(--gut) 40px;max-width:1440px;margin:0 auto}
.crumb{font:300 11.5px/1 var(--f-asc);letter-spacing:.24em;color:var(--lav);margin-bottom:34px;display:inline-block;background:rgba(255,255,255,.85);padding:4px 0}
.doc{position:relative;background:#fff;border:1.5px solid var(--line);margin-top:56px}
.doc .h{width:10px;height:10px}

<div id="boot" role="progressbar" aria-label="載入中 Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">

  <div class="brow" id="bData"><span>&gt; LOAD 網頁資料 DATA</span><i></i><b>[|]</b></div>
  <div class="brow" id="bFonts"><span>&gt; LOAD 字型 FONTS</span><i></i><b>[ ]</b></div>
  <div class="brow" id="bGl"><span>&gt; LOAD 三維資料夾 3D</span><i></i><b>[ ]</b></div>
  <div class="bmeter"><div class="pb"><i id="bootBar"></i></div><span id="bootPct">000%</span></div>
</div>
<script>
/* 開場讀取條。這段放在網頁最前面，網頁其餘部分還在下載時就先顯示。
   進度只在事情真的發生時前進：網頁資料由主程式跑起來時回報、字型照瀏覽器回報的已載入／開始載入檔數、
   三維資料夾畫出第一格時回報。三項的比重照 2026-10-26 線上版實測傳輸量：網頁 302KB、中文字型 1,666KB、three.js 389KB。
   同一個分頁第二次進站不再顯示；點畫面可以略過；20 秒還沒載完就直接放行。 */
(function(){
  const b = document.getElementById('boot');
  window.FITBOOT = {mark(){}};
  let seen = false;
  try{ seen = sessionStorage.getItem('fit-boot') === '1'; }catch(e){}
  if(seen){ b.remove(); return; }
  const W = {data: .13, fonts: .70, gl: .17}, st = {data: 0, fonts: 0, gl: 0}, row = {data: 'bData', fonts: 'bFonts', gl: 'bGl'};
  const bar = document.getElementById('bootBar'), pct = document.getElementById('bootPct'), t0 = Date.now();
  let shown = 0, done = false, fs = 0, fd = 0;
  const log = [];   /* [毫秒, 百分比]，驗收時讀 window.FITBOOT.log 對時間軸 */
  const setRow = (k, txt, ok) => { const r = document.getElementById(row[k]); r.querySelector('b').textContent = txt; r.classList.toggle('ok', !!ok); };
  const finish = () => {
    if(done) return;
    done = true;
    try{ sessionStorage.setItem('fit-boot', '1'); }catch(e){}
    setTimeout(() => { b.classList.add('out'); setTimeout(() => b.remove(), 950); }, Math.max(350, 700 - (Date.now() - t0)));
  };
  const paint = () => {
    const v = st.data * W.data + st.fonts * W.fonts + st.gl * W.gl;
    if(v > shown) shown = v;
    bar.style.transform = `scaleX(${shown.toFixed(3)})`;
    const n = Math.round(shown * 100);
    if(String(n).padStart(3, '0') + '%' !== pct.textContent) log.push([Date.now() - t0, n]);
    pct.textContent = String(n).padStart(3, '0') + '%';
    b.setAttribute('aria-valuenow', n);
    if(st.data === 1 && st.fonts === 1 && st.gl === 1) finish();
  };
  const fontRow = () => {
    if(st.fonts === 1) return;
    fs = Math.max(fs, fd);   /* 開場字型可能在這段程式掛上監聽前就開始下載，分母至少等於已載入數 */
    st.fonts = fs ? Math.min(.95, fd / fs) : 0;
    setRow('fonts', `${fd}/${fs} [|]`);
    paint();
  };
  if(document.fonts){
    document.fonts.addEventListener('loading', e => { fs += e.fontfaces.length; fontRow(); });
    document.fonts.addEventListener('loadingdone', e => { fd += e.fontfaces.length; fontRow(); });
    document.fonts.addEventListener('loadingerror', e => { fd += e.fontfaces.length; fontRow(); });
  }
  window.FITBOOT = {
    log,
    mark(k, note){
      if(done || st[k] === 1) return;
      st[k] = 1;
      setRow(k, (k === 'fonts' && fs ? `${fd}/${fs} ` : '') + (note ? note + ' ' : '') + '[=]', true);
      paint();
    },
  };
  b.addEventListener('click', () => { st.data = st.fonts = st.gl = 1; paint(); });
  setTimeout(() => { st.data = st.fonts = st.gl = 1; paint(); }, 20000);
})();
</script>

  "bio": [
   [
    "Jenny Jasmin Lacay，又名 Jasmot，是一位跨領域藝術家，身兼插畫家、壁畫藝術家、肖像畫家與藝術教育工作者。她以優等成績畢業於 University of the East，並取得 Philippine Women's University 藝術與設計碩士學位。她的創作聚焦於日常生活與真實的人性經驗，並致力讓藝術走入大眾。她曾與 Jordan、UNIQLO、嬌蘭（Guerlain）、蘭蔻（Lancôme）等知名品牌合作，壁畫作品多分布於菲律賓達義市的 Bonifacio Global City（BGC）。除了藝術創作，她也在高中教授視覺藝術課程，透過藝術與教育啟發學生的創造力。"
   ],
   [
    "Jenny Jasmin Lacay also known as Jasmot is a multidisciplinary artist, illustrator, mural artist, portrait artist, and an art educator. A cum laude graduate of the University of the East, she holds a master’s degree in Arts and Design from the Philippine Women’s University. Her artistic practice explores everyday life and authentic human experiences, with a strong commitment to making art accessible to the public. She has collaborated with renowned brands such as Jordan, Uniqlo, Guerlain, and Lancôme, with most of her murals located in Bonifacio Global City (BGC), Taguig. Alongside her artistic practice, she teaches Visual Arts to Senior High School students, inspiring creativity through both art and education."
   ]

  "bio": [
   [
    "拾壹 shiroooo11，出生於台灣彰化，成長於馬來西亞柔佛，畢業於國立臺灣藝術大學，現主要於台灣從事創作。",
    "創作媒材以陶塑與插畫為主，作品風格受到自幼接觸的漫畫文化影響，呈現簡潔、可愛的視覺語言。喜歡嘗試跳脫傳統框架的創作形式，探索不同媒材與表現方式的可能性。"
   ],
   [
    "Shiroooo11(拾壹) was born in Changhua, Taiwan, and grew up in Johor, Malaysia. After graduating from the National Taiwan University of Arts, Shiroooo11 is now mainly based in Taiwan, where the artistic practice continues.",
    "Working mainly with ceramic sculpture and illustration, shiroooo11 draws inspiration from a childhood surrounded by manga. The works have a simple and playful style. Shiroooo11 enjoys exploring new ways of making art, trying different materials, and creating works that go beyond traditional forms."
   ]

  "bio": [
   [
    "藝術家Koctel出生於西班牙的格拉納達，成長於塞維亞。自幼熱愛繪畫與塗鴉，而塞維亞隨處可見的橘子樹，成為他創作的重要靈感來源。他的風格鮮明亮眼，融合塗鴉、插畫與街頭藝術，並以橘子作為個人標誌。他在塗鴉中找到兼具紀律與創作自由的天地，並在各城市牆面上留下的作品，也見證了其藝術風格的演變歷程。"
   ],
   [
    "Koctel is a Spanish artist born in Granada and raised in Seville, where the city’s iconic orange trees became a central source of inspiration. His vibrant style fuses graffiti, illustration, and urban art, with the orange serving as a personal emblem. Drawn to drawing and graffiti from an early age, he found in the latter a space of rigor and creative freedom, and the facades of the cities he painted bear witness to his artistic evolution."
   ]

  "bio": [
   [
    "Omer Lotan 是一位攝影指導暨電影工作者，來自以色列特拉維夫，現居洛杉磯。他的作品橫跨劇情片、紀錄片與廣告，曾於坎城影展、Camerimage 影展及 Slamdance 影展等國際影展放映。商業合作客戶包括 Wix、Visa 與 Soundcore。他是 Film Independent「Project Involve」計畫的 2025 年度學員，並參與美國電影攝影師協會的 ASC Vision Mentorship Program。"
   ],
   [
    "Omer Lotan is a cinematographer and filmmaker originally from Tel Aviv, now based in Los Angeles. His work spans narrative film, documentary, and commercials, and has screened at Cannes, Camerimage, and Slamdance, among other festivals. His commercial clients include Wix, Visa, and Soundcore. He is a 2025 Film Independent Project Involve Fellow and a participant in the ASC Vision Mentorship Program."
   ]

    "Théa Macera 是一位現居里昂的法國藝術家，以紙為媒材，探索身體、土地與植物形態之間的關係。",
    "自 2022 年起，她的創作以手工紙為核心，並從不同情境中觀察到的植物汲取靈感，創作出各式植物形態。她的作品探討自然與人造之間的張力：紙源自生命物質，卻歷經轉化而成，她便以紙作為轉譯與虛構的工具。除了藝術創作，她也透過工作坊推動教育計畫，帶領參與者認識紙的多元形式與技法，進一步探索紙在創作與雕塑上的潛能。"
   ],
   [
    "Théa Macera is a french artist based in Lyon whose work explores the relationships between body, territory, and vegetal forms through paper.",
    "Since 2022, she has developed a practice centered on handmade paper and the creation of botanical forms inspired by flora observed in various contexts. Her work investigates the tension between the natural and the artificial, using paper, a material derived from living matter yet transformed, as a tool for translation and fiction. Alongside her artistic practice, she develops educational projects through workshops, exploring paper in its diverse forms and techniques, and inviting participants to engage with its creative and sculptural potential."
   ]

let lastPath = null;

  const mountGL = () => { const host = $('#hero3d'); if(window.FITGL) window.FITGL.mount(host); else window.FIT.pendingHost = host; };

/* ===== 出現與解碼 ===== */
const GL = '+=|/_<>[]{}*#&:;~^';
function scramble(el){
  const fin = el.dataset.txt || (el.dataset.txt = el.textContent);
  if(RM){ el.textContent = fin; return; }
  const ch = [...fin], N = ch.length, total = Math.min(34, 12 + N * .7);
  let f = 0;
  el.style.display = el.style.display || 'inline-block';
  el.style.minWidth = el.offsetWidth + 'px';
  const tick = () => {
    f++;
    const k = (f / total) * N;
    el.textContent = ch.map((c, i) => i < k || !/[\x21-\x7e]/.test(c) ? c : GL[(Math.random() * GL.length) | 0]).join('');
    if(f < total) setTimeout(tick, 34); else { el.textContent = fin; el.style.minWidth = ''; }
  };
  tick();
}
let io = null;
function initReveal(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    e.target.classList.add('in');
    $$('[data-scr]', e.target).forEach(scramble);
    if(e.target.matches('[data-scr]')) scramble(e.target);
    io.unobserve(e.target);
  }), {rootMargin: '0px 0px -8% 0px'});
  $$('.rv, .crumb[data-scr]').forEach(el => io.observe(el));
}
/* 字母被游標碰到會跳一下，像在畫布上被推動的字 */
function initLetters(){
  if(!FINE) return;
  $$('.lt').forEach(el => {
    el.addEventListener('pointerenter', () => {
      if(el.classList.contains('hit')) return;
      el.classList.add('hit');
      el.style.transform = `translateY(-${8 + Math.random() * 10}%) rotate(${(Math.random() * 14 - 7).toFixed(1)}deg)`;
      setTimeout(() => { el.style.transform = ''; el.classList.remove('hit'); }, 700);
    });
  });
}

/* ===== 主視覺：可拖曳的貝茲錨點、標題捲動、標籤 ===== */
let heroLoop = 0;
function initHero(){
  cancelAnimationFrame(heroLoop);
  const box = $('#heroTitle'), inC = $('#inC'), anc = $('#eAnc'), path = $('#bezP'), hdl = $('#hdl'), edit = $('#hEdit');
  const stick = $('#heroStick'), hero = $('#top');
  const P = {x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0, drag: false};
  function anchors(){
    const b = box.getBoundingClientRect(), c = inC.getBoundingClientRect(), e = anc.getBoundingClientRect();
    return {sx: c.right - b.left, sy: c.top + c.height / 2 - b.top, tx: e.left + e.width * .5 - b.left, ty: e.top + e.height * .2 - b.top};
  }
  let A = anchors();
  P.x = A.tx; P.y = A.ty;
  function draw(){
    const sx = A.sx, sy = A.sy, hx = P.x, hy = P.y;
    path.setAttribute('d', `M${sx},${sy} C${sx + (hx - sx) * .62},${sy} ${hx},${sy + (hy - sy) * .28} ${hx},${hy}`);
    hdl.style.transform = `translate(${hx}px,${hy}px)`;
    edit.style.transform = `translate(${hx + 16}px,${hy + 12}px)`;
  }
  hdl.addEventListener('pointerdown', e => {
    e.preventDefault(); hdl.setPointerCapture(e.pointerId); P.drag = true; hdl.classList.add('dragging');
    const b = box.getBoundingClientRect(); P.ox = e.clientX - b.left - P.x; P.oy = e.clientY - b.top - P.y;
  });
  hdl.addEventListener('pointermove', e => {
    if(!P.drag) return;
    const b = box.getBoundingClientRect();
    P.x = e.clientX - b.left - P.ox; P.y = e.clientY - b.top - P.oy; P.vx = P.vy = 0;
  });
  const up = () => { P.drag = false; hdl.classList.remove('dragging'); };
  hdl.addEventListener('pointerup', up); hdl.addEventListener('pointercancel', up);
  /* 副標每一行字的字框（相對首屏、扣掉捲動造成的位移），給三維那邊的標籤避開用 */
  const measureSub = () => {
    const st = stick.getBoundingClientRect(), off = new DOMMatrix(getComputedStyle(box).transform).m42 || 0, L = [];
    const tw = document.createTreeWalker($('.hero-sub', box), NodeFilter.SHOW_TEXT);
    for(let n = tw.nextNode(); n; n = tw.nextNode()){
      const r = document.createRange(); r.selectNodeContents(n);
      [...r.getClientRects()].forEach(b => L.push({l: b.left - st.left, r: b.right - st.left, t: b.top - st.top - off, b: b.bottom - st.top - off}));
    }
    window.FIT.subLines = L;
    if(window.FITGL && window.FITGL.refit) window.FITGL.refit();   /* 字一換字型、行寬就變，資料夾位置跟著重算 */
  };
  measureSub();
  const signal = pageAC.signal;
  window.addEventListener('resize', () => { A = anchors(); measureSub(); }, {passive: true, signal});
  if(document.fonts){
    document.fonts.ready.then(() => { if(!signal.aborted){ A = anchors(); P.x = A.tx; P.y = A.ty; measureSub(); } });
    document.fonts.addEventListener('loadingdone', () => { A = anchors(); measureSub(); }, {signal});
  }
  const tags = [$('#tagMain'), $('#tagA'), $('#tagB')].filter(Boolean);
  window.FIT.tags = tags;
  const loop = () => {
    heroLoop = requestAnimationFrame(loop);
    if(!document.body.contains(box)) { cancelAnimationFrame(heroLoop); return; }
    if(!P.drag){   /* 放手後彈回原位 */
      P.vx = (P.vx + (A.tx - P.x) * .09) * .8; P.vy = (P.vy + (A.ty - P.y) * .09) * .8;
      P.x += P.vx; P.y += P.vy;
    }
    draw();
    const r = hero.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / Math.max(1, r.height - innerHeight)));
    window.FIT.heroP = p;
    /* 標題跟資料夾用同一個進度：標題完全出現的那一刻，資料夾也剛好闔回原位 */
    box.style.transform = `translate3d(0,${(-p * window.FIT.TITLE_DROP * 100).toFixed(2)}vh,0)`;
    box.style.opacity = (1 - p).toFixed(3);
  };
  loop();
}

/* ===== 藝術家：游標旁浮出雙色調大頭貼 ===== */
function initArtistFloat(){
  const fl = $('#afloat'), list = $('#alist');
  if(!fl || !FINE) return;
  const duo = $('#afDuo'), tag = $('#afTag');
  let x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y, on = false, raf = 0, colorT = 0;
  const loop = () => {
    x += (tx - x) * .16; y += (ty - y) * .16;
    const rot = Math.max(-10, Math.min(10, (tx - x) * .05));
    fl.style.transform = `translate3d(${x + 28}px,${y - fl.offsetHeight / 2}px,0) rotate(${rot.toFixed(2)}deg)`;
    if(on || Math.abs(tx - x) > .5) raf = requestAnimationFrame(loop); else raf = 0;
  };
  list.addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; if(!raf) raf = requestAnimationFrame(loop); });
  $$('.arow', list).forEach(row => row.addEventListener('pointerenter', () => {
    const a = artist(row.dataset.id), i = ARTISTS.indexOf(a);
    duo.className = 'duo' + (a.photo ? '' : ' nophoto');
    duo.innerHTML = a.photo ? `<img src="${a.photo}" alt="">` : `<span class="nopic" style="--g:${grad(i + 3)}">${esc(a.name[0])}</span>`;
    tag.textContent = `${a.id}_${U(a.name)}.jpg`;
    on = true; fl.classList.add('on');
    clearTimeout(colorT); colorT = setTimeout(() => duo.classList.add('color'), 650);
  }));
  list.addEventListener('pointerleave', () => { on = false; fl.classList.remove('on'); clearTimeout(colorT); });
}

/* ===== 作品頁條：滑過展開，觸控先點開再點進 ===== */

function openStrip(s){
  $$('.strip', s.parentNode).forEach(x => { x.classList.toggle('on', x === s); x.classList.remove('peek'); });

function initShelf(){
  const sh = $('#shelf');

  const peek = s => $$('.strip', sh).forEach(x => x.classList.toggle('peek', x === s && !x.classList.contains('on')));
  $$('.strip', sh).forEach(s => {
    if(FINE) s.addEventListener('pointerenter', () => peek(s));
    s.addEventListener('focus', () => peek(s));
  });
  if(FINE) sh.addEventListener('pointerleave', () => peek(null));
}

/* ===== 藝術家內頁：頭像拉一條貝茲線到名字 ===== */
function initTether(){
  const head = $('#apHead');
  if(!head) return;   /* 網址裡的藝術家不存在時，頁面只有找不到的提示，沒有頭像區 */
  const ring = $('.ring', head), name = $('#apName'), path = $('#tetP'), hdl = $('#tetH'), signal = pageAC.signal;
  ring.addEventListener('pointerenter', () => ring.classList.add('color'));
  ring.addEventListener('pointerleave', () => ring.classList.remove('color'));
  const P = {x: 0, y: 0, vx: 0, vy: 0, drag: false};
  let A;
  const anchors = () => {
    const b = head.getBoundingClientRect(), c = ring.getBoundingClientRect(), n = name.getBoundingClientRect();
    A = {sx: c.right - b.left + 10, sy: c.top + c.height * .5 - b.top, tx: n.left - b.left - 14, ty: n.top - b.top + n.height * .15};
  };

  const lo = [], up = [];
  for(const p of pts){ while(lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function pagesHull(){
  root.updateMatrixWorld(true);
  const pts = [];
  pages.forEach(P => { const g = P.mesh.geometry.parameters; [[0, 0], [0, g.height], [g.width, 0], [g.width, g.height], [g.width / 2, g.height], [g.width / 2, 0], [g.width, g.height / 2]].forEach(([x, y]) => pts.push(proj(P.mesh, x, y, 0))); });
  return hull(pts);
}
function hitsText(){
  const L = F.subLines;
  if(!L || !L.length) return false;
  const H = pagesHull();
  return L.some(r => sat(H, [[r.l - 6, r.t], [r.r + 6, r.t], [r.r + 6, r.b], [r.l - 6, r.b]]));
}
function fitShift(){
  shiftX = 0;
  if(!host || !F.subLines || !F.subLines.length) return;
  pose(0, .2, 0, false, false);
  if(!hitsText()) return;
  const W = host.clientWidth, tooFar = () => Math.max(...pagesHull().map(p => p[0])) > W * 1.1;
  let lo = 0, hi = 0;
  for(let s = .25; s <= 6; s += .25){ shiftX = s; pose(0, .2, 0, false, false); if(!hitsText()){ hi = s; break; } if(tooFar()){ hi = -s; break; } lo = s; }
  if(hi < 0){ shiftX = lo; return; }   /* 推到上限還碰得到：停在不超出畫面的最遠處 */
  if(hi === 0){ shiftX = lo; return; }
  for(let k = 0; k < 8; k++){ const m = (lo + hi) / 2; shiftX = m; pose(0, .2, 0, false, false); if(hitsText()) lo = m; else hi = m; }
  shiftX = hi;
}
/* 資料夾的姿勢：p 是捲動進度，px、py 是游標位置；smooth 為真時每格往目標靠一點，為假時直接擺到目標（量測用） */
function pose(p, px, py, inside, smooth){
  const base = root.userData.base || tmp.set(0, 0, 0), C = CFG;
  root.position.set(base.x + shiftX, base.y + p * .9, base.z);
  root.rotation.set(C.rx + p * .34 + py * .06, C.ry + px * .18 - p * .22, C.rz + px * .025);
  /* 頁的角度：一疊頁平均分布在 A0 到 A1，游標附近的頁會被撐開，像用手指翻檔案；
     每張頁也繞底端那一點在自己的平面上散開，像海報裡收在一個角的頁扇 */
  const A0 = lerp(C.a0, C.a0o, p) * Math.PI, A1 = lerp(C.a1, C.a1o, p) * Math.PI;
  const fc = (px + 1) / 2;
  for(let i = 0; i < N; i++){
    const P = pages[i];
    let f = (i + .5) / N;
    const d = f - fc;
    f += .55 * d * Math.exp(-(d * d) / (2 * .018)) * (inside ? 1 : .35);
    f = Math.min(1, Math.max(0, f));
    const target = lerp(A0, A1, f);
    P.a = smooth ? P.a + (target - P.a) * .1 : target;
    P.piv.rotation.set(0, -P.a, (f - .5) * C.fanZ * (1 + p * .8));
    P.piv.position.set(0, -PH / 2, i * .004);
  }
  front.rotation.y = -lerp(.9, .965, p) * Math.PI;
  back.rotation.y = -(A1 + .05 * Math.PI);
}
const lerp = (a, b, t) => a + (b - a) * t;
/* 任何一格畫壞就收掉三維、換回平面頁扇，不留一片空白 */
function frame(now){
  raf = requestAnimationFrame(frame);
  if(!vis || document.hidden) return;
  try{ step(now); }catch(err){
    console.warn('三維頁扇出錯，改用平面頁扇', err);
    window.FITBOOT.mark('gl', '—');
    const h = host; API.unmount(); if(h) h.classList.remove('gl'); window.FITGL = null;
  }
}
function step(now){
  const t = F.RM ? 2 : (now - t0) / 1000;
  ptr.x += (ptr.tx - ptr.x) * .06; ptr.y += (ptr.ty - ptr.y) * .06;
  prog += ((F.heroP || 0) - prog) * .3;   /* 每格追上剩餘差距的三成：捲動停下後約 0.2 秒收完，不拖拍 */
  const p = F.RM ? .25 : prog, C = CFG;
  pose(p, ptr.x, ptr.y, ptr.inside, true);
  /* 彎度照頁序遞增：最前面那張最平、最後面那張最彎，一疊頁的弧度有順序 */
  pages.forEach((P, i) => {
    P.m.uniforms.uTime.value = t;
    P.m.uniforms.uCurl.value = C.curl * (.8 + .4 * i / (N - 1)) + p * .2;
  });
  pool.material.uniforms.uTime.value = t;
  R.render(scene, cam);
  window.FITBOOT.mark('gl');   /* 第一格畫出來才算三維載完；之後每格呼叫都會被略過 */
  overlays();
}
/* 手機上大標籤不准壓到首屏副標的任何一行字：旋轉後的標籤與字框相交就往右推，推到剛好不碰 */
function sat(A, B){
  const axes = ps => ps.map((p, i) => { const q = ps[(i + 1) % ps.length]; return [p[1] - q[1], q[0] - p[0]]; });
  const span = (ps, ax) => { let lo = Infinity, hi = -Infinity; ps.forEach(p => { const v = p[0] * ax[0] + p[1] * ax[1]; lo = Math.min(lo, v); hi = Math.max(hi, v); }); return [lo, hi]; };
  return [...axes(A), ...axes(B)].every(ax => { const a = span(A, ax), b = span(B, ax); return a[1] > b[0] + 2 && b[1] > a[0] + 2; });
}
function clearOfText(ax, ay, rad, w, h){
  const L = F.subLines;
  if(!L || !L.length || host.clientWidth > 820) return 0;
  const dy = -(F.heroP || 0) * F.TITLE_DROP * innerHeight, c = Math.cos(rad), s = Math.sin(rad);
  const boxes = L.map(r => [[r.l - 6, r.t + dy], [r.r + 6, r.t + dy], [r.r + 6, r.b + dy], [r.l - 6, r.b + dy]]);
  for(let dx = 0; dx <= 240; dx += 4){
    const P = [[0, 0], [w, 0], [w, h], [0, h]].map(([px, py]) => [ax + dx + px * c - py * s, ay + px * s + py * c]);
    if(!boxes.some(b => sat(P, b))) return dx;
  }
  return 0;
}
/* 把三維空間裡的幾個點投影到螢幕，讓直式標籤和錨點方塊黏在頁上 */
function proj(obj, x, y, z){
  tmp.set(x, y, z); obj.localToWorld(tmp); tmp.project(cam);
  return [(tmp.x + 1) / 2 * host.clientWidth, (1 - tmp.y) / 2 * host.clientHeight];
}
function overlays(){
  /* 大標籤黏在中段那張頁的上緣；兩張小標籤接在大標籤左下角下面，跟著它走 */
  const tags = F.tags || [];
  const mid = pages[Math.floor(N * .6)], gp = mid.mesh.geometry.parameters;
  const place = (el, x, y, rot) => { if(el) el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`; };
  if(tags[0]){
    const [x0, y0] = proj(mid.mesh, gp.width * .5, gp.height * .97, 0);
    const rot = -18 + ptr.x * 3, rad = rot * Math.PI / 180, h0 = tags[0].offsetHeight, w0 = tags[0].offsetWidth;
    let ax = x0 - w0 / 2;
    const ay = y0 - h0 * .12;
    ax += clearOfText(ax, ay, rad, w0, h0);
    place(tags[0], ax, ay, rot);
    const bx = ax - h0 * Math.sin(rad), by = ay + h0 * Math.cos(rad);
    if(tags.length === 3){
      const wa = tags[1].offsetWidth;
      place(tags[1], bx - wa * .2, by + 6, -3);
      place(tags[2], bx + wa * .85 + 6, by + 24, -2 + ptr.x * 1.5);
    } else if(tags[1]) place(tags[1], bx, by + 8, -3);
  }
  const lp = pages[N - 1].mesh.geometry.parameters;
  const pts = [proj(front, CW, -CH / 2, 0), proj(front, CW * .59, CH / 2 + .34, 0), proj(pages[N - 1].mesh, lp.width, lp.height, 0), proj(root, 0, -PH / 2, 0)];
  pts.forEach((xy, k) => { if(handles[k]) handles[k].style.transform = `translate(${xy[0].toFixed(1)}px,${xy[1].toFixed(1)}px)`; });
}
function onMove(e){
  const r = host.getBoundingClientRect();
  ptr.px = (e.clientX - r.left) / r.width; ptr.py = (e.clientY - r.top) / r.height;
  ptr.tx = ptr.px * 2 - 1; ptr.ty = ptr.py * 2 - 1;
  ptr.inside = ptr.px >= 0 && ptr.px <= 1 && ptr.py >= 0 && ptr.py <= 1;
}
function onLeave(){ ptr.inside = false; ptr.tx = .2; ptr.ty = 0; }

const API = {
  mount(el){
    try{ if(!R) init(); }catch(err){ console.warn('WebGL 不可用，改用平面頁扇', err); R = null; window.FITGL = null; window.FITBOOT.mark('gl', '—'); return; }
    host = el;
    host.appendChild(R.domElement);
    host.classList.add('gl');
    handles = [0, 1, 2, 3].map(() => { const h = document.createElement('i'); h.className = 'vh'; host.appendChild(h); return h; });
    resize();
    roV = new ResizeObserver(resize); roV.observe(host);
    ioV = new IntersectionObserver(es => { vis = es[0].isIntersecting; if(!vis) window.FITBOOT.mark('gl', '—'); }); ioV.observe(host);
    window.addEventListener('pointermove', onMove, {passive: true});
    host.addEventListener('pointerleave', onLeave);
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  },
  unmount(){
    cancelAnimationFrame(raf); raf = 0; vis = false;
    if(roV) roV.disconnect(); if(ioV) ioV.disconnect();
    window.removeEventListener('pointermove', onMove);
    if(host) host.removeEventListener('pointerleave', onLeave);
    if(R && R.domElement.parentNode) R.domElement.parentNode.removeChild(R.domElement);
    handles.forEach(h => h.remove()); handles = [];
    host = null;
  },
};
API.refit = () => { if(host && R) fitShift(); };
API.fitInfo = () => ({shiftX: +shiftX.toFixed(3), clear: !hitsText(), prog: +prog.toFixed(4)});
window.FITGL = API;
if(F.pendingHost && document.body.contains(F.pendingHost)){ const h = F.pendingHost; F.pendingHost = null; API.mount(h); }
</script>
