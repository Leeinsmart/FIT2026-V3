<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臺北資料夾 File in Taipei 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@300;400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff;--navy:#224c88;--mag:#c63079;--mag-s:#cb5993;--line:#a6d6dc;--line-d:#5fb3bd;--asc:#a4d0d1;--lav:#908dc4;--ink:#221815;--grey:#575959;
  --sky:#95d3ed;--orange:#ef7d3c;--peri:#8ea9df;--lavender:#b5b5d6;--mint:#a3cbb4;--yellow:#f2e68c;--pink:#f3c5d9;--green:#2f7a55;--duo-l:#f1c6e1;
  --f-lat:"Alegreya","Noto Sans TC",serif;--f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--f-asc:"Jost","Noto Sans TC",sans-serif;--f-tag:"LXGW WenKai TC","Noto Sans TC",serif;
  --gut:clamp(16px,4vw,56px);--ease:cubic-bezier(.7,0,.2,1);--spring:cubic-bezier(.3,1.6,.4,1);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-zh);line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
[lang=en]{font-family:var(--f-lat)}
::selection{background:var(--mag);color:#fff}
:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
#ascii{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}

/* ── 頂列 ── */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:20px;height:68px;padding:0 var(--gut);pointer-events:none}
.bar>*{pointer-events:auto}
.logo{display:flex;align-items:baseline;gap:10px;color:var(--navy);background:rgba(255,255,255,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 10px 6px 0}
.logo b{font:500 23px/1 var(--f-lat)}
.logo span{font:500 12px/1 var(--f-zh);letter-spacing:.24em;color:var(--mag)}
.coord{margin-left:auto;font:300 10.5px/1 var(--f-asc);letter-spacing:.24em;color:var(--lav);white-space:nowrap}
.nav{display:flex;gap:6px}
.nav a{display:flex;align-items:baseline;gap:7px;font:400 11px/1 var(--f-asc);letter-spacing:.22em;text-transform:uppercase;color:var(--navy);padding:11px 15px 10px;border:1.5px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px 12px 2px 2px;transition:background .3s,color .3s,border-color .3s}
.nav a b{font:500 13px/1 var(--f-zh);letter-spacing:.12em}
.nav a:hover,.nav a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.burger{display:none;margin-left:auto;font:400 11px/1 var(--f-asc);letter-spacing:.24em;color:var(--navy);padding:11px 14px;border:1.5px solid var(--line);background:#fff;border-radius:12px 12px 2px 2px}
@media (max-width:820px){.coord,.nav{display:none}.burger{display:block}.logo b{font-size:20px}}
.menu{position:fixed;inset:0;z-index:45;background:var(--paper);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:90px var(--gut) 40px;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .7s var(--ease),visibility 0s .7s}
.menu.open{clip-path:inset(0);visibility:visible;transition:clip-path .7s var(--ease)}
.menu a{position:relative;z-index:1;font:500 clamp(46px,13vw,80px)/1 var(--f-lat);color:var(--navy)}
.menu a small{display:block;font:500 15px/1.6 var(--f-zh);letter-spacing:.32em;color:var(--mag)}
.menu .mstrips{position:absolute;right:0;top:0;bottom:0;width:34%;display:flex;gap:3px}
.menu .mstrips i{flex:1;background:var(--g);position:relative}
.menu .mfoot{position:relative;z-index:1;font:300 11px/1.8 var(--f-asc);letter-spacing:.18em;color:var(--lav);margin-top:30px}

/* ── 首頁主視覺 ── */
/* 首屏固定住的捲動距離＝高度減一個螢幕：電腦 40%、手機 35% 個螢幕高，約一次滑動開合完 */
.hero{position:relative;height:140vh}
.hero-stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto;row-gap:16px}
/* 動態視覺與入口各佔一列；旋轉的吊牌與三維畫面都只能畫在視覺區內。 */
.hero-art{position:relative;min-width:0;min-height:0;overflow:hidden;contain:paint}
.hero-foot{position:relative;z-index:6;padding:0 var(--gut) max(20px,env(safe-area-inset-bottom))}
.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px clamp(28px,6vw,88px)}
.hero-actions .hash{position:relative;display:grid;align-items:center;min-height:44px;padding:0 2px}
.hero-foot .hud{position:static;margin-top:12px}
.hero-3d{position:absolute;inset:0}
.hero-3d canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.hero-3d.gl .ffan{display:none}
.ffan{position:absolute;right:12%;bottom:12%;width:30vw;height:62vh}
.ffan i{position:absolute;left:50%;bottom:0;width:22%;height:100%;transform-origin:50% 100%;border:1.5px solid var(--line);background:var(--g)}
.ffan i::after,.sgrain,.duo::before{content:'';position:absolute;inset:0;background:var(--grain);mix-blend-mode:multiply;opacity:.32;pointer-events:none}
.hero-title{position:absolute;left:var(--gut);top:clamp(96px,15vh,170px);z-index:3;color:var(--navy);pointer-events:none;will-change:transform,opacity}
.yr{font:700 clamp(24px,2.6vw,42px)/1 var(--f-lat);color:var(--mag-s);letter-spacing:.04em;margin-left:.06em}
.wm{margin:.08em 0 0;font:500 clamp(74px,10.4vw,196px)/.9 var(--f-lat);letter-spacing:-.004em}
.wm .ln{display:block}
.wm .in{display:inline-grid;place-items:center;width:1.04em;height:1.04em;border:.035em solid var(--mag-s);border-radius:50%;font-size:.6em;color:var(--mag-s);margin:.14em 0 .12em .2em;line-height:1;background:rgba(255,255,255,.7)}
.wm .in span{transform:translateY(-.06em)}
.lt{display:inline-block;pointer-events:auto;transition:transform .6s var(--spring),color .3s,text-shadow .3s}
.lt.hit{color:var(--mag);text-shadow:.045em .03em 0 rgba(149,211,237,.95)}
.hero-sub{margin-top:clamp(20px,3.4vh,40px);max-width:30em}
.hero-sub .zh{font:500 clamp(13px,1.1vw,17px)/1.7 var(--f-zh);color:var(--mag);letter-spacing:.16em}
.hero-sub .en{font:500 clamp(16px,1.45vw,23px)/1.3 var(--f-lat);color:var(--mag);margin-top:4px}
.hero-sub .dt{font:300 11.5px/1 var(--f-asc);letter-spacing:.28em;color:var(--navy);margin-top:16px}
.bez{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:4}
.bez path{fill:none;stroke:var(--mag-s);stroke-width:2}
.hdl{position:absolute;left:0;top:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border:2px solid var(--mag-s);background:#fff;z-index:5;cursor:grab;touch-action:none;pointer-events:auto}
.hdl::after{content:'';position:absolute;inset:-16px}
.hdl.dragging{cursor:grabbing;background:var(--mag-s)}
.vtag{position:absolute;left:0;top:0;z-index:3;transform-origin:0 0;writing-mode:vertical-rl;background:#fff;border:1.5px solid var(--line);font-family:var(--f-tag);line-height:1;will-change:transform;pointer-events:none}
.vtag.big{font-weight:700;font-size:clamp(34px,min(3.9vw,6.4vh),74px);color:var(--navy);letter-spacing:.06em;padding:.32em .2em}
.vtag.s{font-size:clamp(14px,min(1.3vw,2.2vh),22px);color:var(--mag);letter-spacing:.1em;padding:.5em .3em}
.vtag .sq,.h,.vh{position:absolute;width:10px;height:10px;border:1.5px solid var(--line);background:#fff}
.vtag .sq{right:-6px;top:-6px}
.vh{left:0;top:0;margin:-5px 0 0 -5px;z-index:2;pointer-events:none}
.hash{position:absolute;z-index:3;font:500 italic clamp(15px,1.4vw,22px)/1 var(--f-zh);color:var(--grey);letter-spacing:.02em;white-space:nowrap}
button.hash:hover{color:var(--mag)}
.h-edit{left:0;top:0;pointer-events:none;color:var(--mag-s);font-size:13px}
.checker{position:absolute;right:6%;top:52%;z-index:3;font:700 clamp(110px,11vw,190px)/1 var(--f-asc);color:transparent;background:repeating-conic-gradient(#2a2a2a 0 25%,#fff 0 50%) 0 0/9px 9px;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.5px #2a2a2a;user-select:none}
.blob{position:absolute;left:4%;bottom:7%;z-index:3;width:clamp(92px,9vw,150px);user-select:none}
.drag{cursor:grab;touch-action:none}
.drag:active{cursor:grabbing}
.hud{position:absolute;left:var(--gut);right:var(--gut);bottom:20px;display:flex;justify-content:space-between;gap:20px;font:300 10.5px/1.5 var(--f-asc);letter-spacing:.24em;color:var(--navy);z-index:3;pointer-events:none}
.hud .sc{animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:820px){
  .hero{height:135vh}
  .hero-title{top:96px}
  .wm{font-size:clamp(64px,19vw,110px)}
  .hero-sub{max-width:80vw}
  /* 手機上桃紅字各拆兩行：臺北市／國內外青年藝術家交流計畫；英文在 Residency 前換行 */
  .hero-sub .zh span{display:block}
  .hero-sub .en{max-width:15.5em}
  .checker{right:4%;top:38%;font-size:84px}
  .blob{left:auto;right:30%;bottom:6%;width:72px}
  .hud span:first-child{display:none}
  #tagA,#tagB{display:none}
}

/* ── 數字列 ── */
.stats{position:relative;display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:24px;align-items:end;padding:clamp(70px,12vh,130px) var(--gut) 20px}
.path{font:300 12px/2 var(--f-asc);letter-spacing:.2em;color:var(--lav);align-self:start}
.stat{display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--navy);border-top:1.5px solid var(--line);padding-top:14px}
.stat b{font:400 clamp(64px,8vw,132px)/.9 var(--f-lat);letter-spacing:-.02em;font-variant-numeric:lining-nums}
.stat b.d{font-size:clamp(26px,2.6vw,42px);line-height:1.1;letter-spacing:0}
.stat span{font:500 14px/1.6 var(--f-zh);letter-spacing:.16em;margin-top:8px}
.stat span em{font:italic 500 16px var(--f-lat);letter-spacing:0;color:var(--mag);margin-left:4px}
button.stat:hover b{color:var(--mag)}
@media (max-width:820px){.stats{grid-template-columns:1fr 1fr}.path{grid-column:1/-1}.stat.dates{grid-column:1/-1}}

/* ── 區段標頭 ── */
/* 內容區蓋一層半透明白，背景字元只在左右邊緣露出，像海報 */
.sec,.stats,.page{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.86) 9%,rgba(255,255,255,.86) 91%,rgba(255,255,255,0))}
.sec{position:relative;padding:clamp(80px,13vh,150px) var(--gut) clamp(40px,8vh,90px)}
.sec.intro{padding-top:clamp(30px,6vh,70px);padding-bottom:0}
.sec.intro .doc{margin-top:0}
.sh{position:relative;display:flex;align-items:flex-end;gap:18px;border-bottom:1.5px solid var(--line);padding-bottom:16px;margin-bottom:10px}
.sh .k{position:absolute;left:0;top:-30px;font:300 11.5px/1 var(--f-asc);letter-spacing:.26em;color:var(--lav)}
.sh h2{margin:0;font:700 clamp(34px,4.4vw,64px)/1 var(--f-zh);color:var(--navy);letter-spacing:.08em}
.sh h2 em{font:italic 500 .78em var(--f-lat);color:var(--mag);margin-left:.35em;letter-spacing:0}
.sh .n{margin-left:auto;font:300 clamp(34px,4.4vw,64px)/1 var(--f-asc);color:var(--line);letter-spacing:.06em}

/* ── 藝術家清單 ── */
.alist{list-style:none;margin:0;padding:0;position:relative}
.arow{display:grid;grid-template-columns:72px minmax(0,1.5fr) minmax(0,1fr) 110px;align-items:baseline;gap:18px;padding:20px 0 18px;border-bottom:1px dashed var(--line);color:var(--navy);position:relative;background:rgba(255,255,255,.72)}
.aid{font:300 11.5px/1 var(--f-asc);letter-spacing:.24em;color:var(--lav)}
.anm{font:500 clamp(34px,4.6vw,78px)/1.02 var(--f-lat);transition:transform .6s var(--spring),color .3s,text-shadow .3s;transform-origin:0 50%;overflow-wrap:anywhere}
.arow:hover .anm,.arow:focus-visible .anm{transform:translateX(.22em) skewX(-6deg);color:var(--mag);text-shadow:.035em .025em 0 rgba(149,211,237,.95)}
.ant{font:400 14px/1.45 var(--f-zh);color:var(--ink)}
.ant [lang=en]{display:block;color:var(--grey);font-size:15.5px}
.ayr{font:300 11px/1.9 var(--f-asc);letter-spacing:.2em;text-align:right;color:var(--navy)}
.ath{display:none}
@media (max-width:820px){
  .arow{grid-template-columns:78px minmax(0,1fr);gap:4px 16px;align-items:center;padding:16px 0}
  .ath{display:block;grid-row:1/span 4;width:78px;height:78px;border-radius:50%}
  .anm{font-size:clamp(30px,9vw,44px)}
  .ayr{text-align:left}
}
/* 浮出的照片搬到 body 層，疊在選取框（#sel，55）上面、游標（#cur，95）下面；留在 #app 裡的話整個 #app 只有 z-index 1，蓋不過選取框 */
.afloat{position:fixed;left:0;top:0;z-index:56;width:clamp(210px,19vw,300px);pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
.afloat.on{opacity:1}
.afloat .duo{aspect-ratio:1;border:1.5px solid var(--line)}
.afloat .h{width:9px;height:9px;border-color:var(--line-d)}
.afloat .atag{position:absolute;left:-1.5px;top:100%;margin-top:6px;background:#fff;border:1.5px solid var(--line);font:300 10px/1 var(--f-asc);letter-spacing:.2em;color:var(--navy);padding:6px 8px;white-space:nowrap}
.h.tl{left:-5px;top:-5px}.h.tr{right:-5px;top:-5px}.h.bl{left:-5px;bottom:-5px}.h.br{right:-5px;bottom:-5px}

/* 雙色調：暗部綠、亮部粉，像主視覺裡那張顆粒照片 */
.duo{display:block;position:relative;overflow:hidden;background:var(--duo-l);isolation:isolate}
.duo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.12) brightness(1.04);mix-blend-mode:multiply;transition:filter .7s}
.duo::after{content:'';position:absolute;inset:0;background:var(--green);mix-blend-mode:lighten;transition:opacity .7s;pointer-events:none}
.duo::before{z-index:2;opacity:.42}
/* Safari 在照片做濾鏡動畫時，外層的圓角裁切剪不住它，轉彩色那 0.7 秒會露出方形；照片和兩層色彩各自跟著外框的圓角 */
.duo img,.duo::before,.duo::after{border-radius:inherit}
.duo.color img{filter:none;mix-blend-mode:normal}
.duo.color::after{opacity:0}
.nopic{display:grid;place-items:center;width:100%;height:100%;font:500 clamp(40px,6vw,90px)/1 var(--f-lat);color:var(--navy);background:var(--g)}
.duo.nophoto{background:none}.duo.nophoto::after{display:none}

/* ── 作品頁條 ── */
.shelf{display:flex;gap:5px;height:min(78vh,760px);margin-top:28px}
.strip{position:relative;flex:1 1 0;min-width:0;overflow:hidden;background:var(--g);border:1.5px solid var(--line);border-radius:3px 16px 3px 3px;transition:flex-grow .8s var(--ease);color:var(--navy)}
.strip.on{flex-grow:7.5}
@media (min-width:821px){
  .strip.peek{flex-grow:2.1;transition-duration:.55s}
  .strip.peek .slab{transform:translateX(-50%) rotate(-7deg)}
}
.sband{position:absolute;left:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(0deg,var(--green) 0 2px,var(--duo-l) 2px 3px);opacity:.85;-webkit-mask:var(--grain);mask:var(--grain);-webkit-mask-size:120px;mask-size:120px}
.sid{position:absolute;left:12px;top:12px;font:300 10.5px/1 var(--f-asc);letter-spacing:.2em;background:#fff;border:1.5px solid var(--line);padding:5px 6px;z-index:2}
.slab{position:absolute;left:50%;top:56px;transform:translateX(-50%) rotate(-3deg);writing-mode:vertical-rl;background:#fff;border:1.5px solid var(--line);font:700 clamp(14px,1.3vw,20px)/1 var(--f-tag);letter-spacing:.12em;padding:.6em .35em;max-height:calc(100% - 110px);overflow:hidden;transition:opacity .4s,transform .6s var(--spring);white-space:nowrap}
.slab.lat{font:500 clamp(14px,1.25vw,19px)/1 var(--f-lat);letter-spacing:.02em}
.strip.on .slab{opacity:0;transform:translateX(-50%) rotate(-12deg) scale(.9)}
.sopen{position:absolute;left:clamp(16px,2.4vw,40px);right:clamp(16px,2.4vw,40px);bottom:clamp(16px,3vh,36px);display:flex;flex-direction:column;align-items:flex-start;gap:10px;opacity:0;transform:translateY(24px);transition:opacity .35s,transform .7s var(--ease);pointer-events:none}
.strip.on .sopen{opacity:1;transform:none;transition-delay:.25s}
.sk{font:300 10.5px/1 var(--f-asc);letter-spacing:.24em;background:#fff;border:1.5px solid var(--line);padding:6px 8px}
.stt{background:#fff;border:1.5px solid var(--line);padding:.18em .32em .22em;font:700 clamp(26px,3.2vw,52px)/1.15 var(--f-zh);letter-spacing:.04em;max-width:100%}
.stt.lat{font:500 clamp(28px,3.4vw,56px)/1.05 var(--f-lat);letter-spacing:0}
.sst{background:#fff;padding:.15em .4em;font:italic 500 clamp(16px,1.5vw,22px)/1.25 var(--f-lat);color:var(--mag);max-width:100%}
.sar,.smd{background:rgba(255,255,255,.9);padding:4px 8px;font:400 13.5px/1.5 var(--f-zh);max-width:100%}
.sgo{font:400 11px/1 var(--f-asc);letter-spacing:.24em;color:#fff;background:var(--navy);padding:10px 14px;margin-top:6px}
.strip:hover .sgo{background:var(--mag)}
@media (max-width:820px){
  .shelf{flex-direction:column;height:auto;gap:5px}
  .strip{flex:none;height:74px;transition:height .7s var(--ease);border-radius:3px 3px 3px 16px}
  .strip.on{height:min(78vh,440px)}
  /* 編號框與作品名橫排，作品名接在編號框後面，編號多了 ▶ 也不會蓋到 */
  .strip{display:flex;align-items:center;gap:10px;padding:0 14px 0 26px}
  .strip.on{align-items:flex-start;padding-top:12px}
  .strip .sid{position:relative;left:auto;top:auto;flex:none}
  .strip .slab{position:relative;left:auto;top:auto;flex:0 1 auto;min-width:0;writing-mode:horizontal-tb;transform:rotate(-1.5deg);max-height:none;padding:.4em .5em;text-overflow:ellipsis}
  .strip.on .slab{transform:rotate(-6deg) scale(.9)}
}

/* ── 頁尾 ── */
.foot{position:relative;z-index:1;margin-top:60px;border-top:1.5px solid var(--line);background:#fff;overflow:hidden;padding:0 0 26px}
.mq{display:flex;width:max-content;white-space:nowrap;padding:34px 0 18px;font:500 clamp(64px,12vw,210px)/1 var(--f-lat);color:transparent;-webkit-text-stroke:1.5px var(--line);animation:mq 38s linear infinite}
.mq span{padding-right:.4em}
.mq em{font-style:normal;font-family:var(--f-tag);font-weight:700;-webkit-text-stroke:1.5px var(--mag-s);font-size:.62em;vertical-align:.18em;padding:0 .3em}
@keyframes mq{to{transform:translateX(-50%)}}

  let shown = 0, done = false, fs = 0, fd = 0;
  const log = [];   /* [毫秒, 百分比]，驗收時讀 window.FITBOOT.log 對時間軸 */
  const setRow = (k, txt, ok) => { const r = document.getElementById(row[k]); r.querySelector('b').textContent = txt; r.classList.toggle('ok', !!ok); };
  const finish = () => {
    if(done) return;
    done = true;
    try{ sessionStorage.setItem('fit-boot', '1'); }catch(e){}
    setTimeout(() => { b.classList.add('out'); setTimeout(() => b.remove(), 950); }, Math.max(350, 700 - (Date.now() - t0)));
  };
  const paint = () => {
    const v = st.data * W.data + st.fonts * W.fonts + st.gl * W.gl;
    if(v > shown) shown = v;
    bar.style.transform = `scaleX(${shown.toFixed(3)})`;
    const n = Math.round(shown * 100);
    if(String(n).padStart(3, '0') + '%' !== pct.textContent) log.push([Date.now() - t0, n]);
    pct.textContent = String(n).padStart(3, '0') + '%';
    b.setAttribute('aria-valuenow', n);
    if(st.data === 1 && st.fonts === 1 && st.gl === 1) finish();
  };
  const fontRow = () => {
    if(st.fonts === 1) return;
    fs = Math.max(fs, fd);   /* 開場字型可能在這段程式掛上監聽前就開始下載，分母至少等於已載入數 */
    st.fonts = fs ? Math.min(.95, fd / fs) : 0;
    setRow('fonts', `${fd}/${fs} [|]`);
    paint();
  };
  if(document.fonts){
    document.fonts.addEventListener('loading', e => { fs += e.fontfaces.length; fontRow(); });
    document.fonts.addEventListener('loadingdone', e => { fd += e.fontfaces.length; fontRow(); });
    document.fonts.addEventListener('loadingerror', e => { fd += e.fontfaces.length; fontRow(); });
  }
  window.FITBOOT = {
    log,
    mark(k, note){
      if(done || st[k] === 1) return;
      st[k] = 1;
      setRow(k, (k === 'fonts' && fs ? `${fd}/${fs} ` : '') + (note ? note + ' ' : '') + '[=]', true);
      paint();
    },
  };
  b.addEventListener('click', () => { st.data = st.fonts = st.gl = 1; paint(); });
  setTimeout(() => { st.data = st.fonts = st.gl = 1; paint(); }, 20000);
})();
</script>

   [
    "中山區赤峰街深具金屬加工與打鐵產業之歷史脈絡，其商業活動長期與金屬材料緊密結合。隨時代推移轉型為汽車零件與維修產業之集散地，現今此區呈現傳統產業與現代藝文空間並置的獨特地景，於工業底蘊中交織出當代文化的時空對話。",
    "當地商家專精於二手零件之維修與重組，使物質在修復中重獲流通價值。此種對進口零件進行精細再生之實踐，構成作品之核心哲學：物質之循環與修復美學。在赤峰街，「修復」並非單純的功能恢復，而是一種連結過去與未來的藝術隱喻。"
   ],
   [
    "Chifeng Street in the Zhongshan District possesses a profound historical context rooted in metalworking and blacksmithing industries, where commercial activities have long been inextricably linked with metallic materials. Originally serving as the core of the \"Blacksmith Street,\" the area evolved into a hub for automobile parts and repair services over time. Today, this district presents a unique landscape where traditional industries and contemporary art spaces coexist, weaving a dialogue between past and present within an industrial foundation.",
    "Local merchants specialize in the repair and reassembly of second-hand parts, allowing materials to regain circulation value through restoration. This practice of meticulous regeneration of imported components forms the core philosophy of the work: the aesthetics of material circulation and repair. In Chifeng Street, \"repair\" is not merely functional recovery, but an artistic metaphor connecting the past and the future."
   ]

  "desc": [
   [
    "一直以來，怪獸都是貫穿拾壹shiroooo11 作品的重要代表性符號。這次的設計中，藝術家將一隻魚化身為花壽司怪獸，穿梭於條通商圈之間。",
    "條通商圈所在區域，是臺北日治時期日本人聚居與商業、飲食娛樂活動的重要街區之一。至今仍保留濃厚的日本街區氛圍，也在長期的歷史交流中，發展出臺日文化交織的城市樣貌。",
    "因此，在這件作品中，拾壹shiroooo11選擇以臺灣近代建築常見的花磚紋樣，結合日本飲食文化中具有代表性的拉麵與花壽司，作為畫面的主要視覺元素。壽司魚遊走於臺式與日式生活意象之間，象徵兩種文化在日常生活中的交會、互相影響，並逐漸發展出屬於臺灣的文化風景。",
    "作品中的魚與麵條也承載著祝福寓意。魚象徵「年年有餘、豐衣足食」；麵條在華人與日本文化中，都有平安順遂、情誼長久的寓意。藝術家希望透過這兩個元素，表達對文化交流的祝福，也祝願這份跨文化的情誼能夠長久延續。"
   ],
   [
    "Monsters have always been a recurring symbol in shiroooo11's work. For this mural, the artist transformed a fish into a flower sushi monster, swimming through the Tiaotong district.",
    "During the Japanese colonial period, the Tiaotong district was an important area in Taipei where Japanese residents lived and engaged in commercial, dining, and entertainment activities. Today, the neighborhood retains a strong Japanese atmosphere, while its long history of cultural exchange has shaped a unique urban landscape where Taiwanese and Japanese cultures intertwine.",
    "For this work, shiroooo11 combined colorful floral tiles, commonly found in Taiwan's modern architecture, with ramen and flower sushi, iconic elements of Japanese food culture. The sushi fish travels between Taiwanese and Japanese cultural imagery, symbolizing how the two cultures meet and influence one another in everyday life, gradually shaping a cultural landscape unique to Taiwan.",
    "The fish and noodles in the work also carry wishes of good fortune. The fish symbolizes abundance and prosperity, echoing the Chinese saying \"may you have surplus year after year.\" In both Chinese and Japanese cultures, noodles represent peace, good fortune, and lasting friendship. Through these two elements, the artist hopes to express blessings for cultural exchange and wishes for this cross-cultural friendship to endure for years to come."
   ]

  "desc": [
   [
    "本計畫始於一朵以紙與紙漿製作而成的巨型花朵。這朵花並未停留在展覽空間中，而是被帶進城市，成為一件具表演性的物件，也成為開啟社會互動的契機。",
    "藝術家帶著花朵走過不同街區與日常場域，邀請陌生人與花合影，促成隨機的相遇與意想不到的拍攝情境。參與者可以自由選擇姿勢、提議地點，或自創情境，讓每一次互動都以各自的方式形塑這項計畫。一面中英雙語的告示牌向路人介紹計畫內容，邀請他們一同參與。",
    "起初，藝術家對於人們會有什麼反應感到忐忑，卻逐漸發現一種出乎意料的開放與慷慨。好奇、笑聲、讚美與自發的參與，讓這段經驗成為一種認識臺北的方式，跳脫一般觀光客的視角。過程本身也成為冒險的一部分：花朵不尋常的尺寸，在城市各處帶來了臨場應變的解決辦法、熱心相助的相遇，以及意料之外的繞道。",
    "最終的攝影作品輸出於鋁板上，構成一本視覺日記，記錄花朵的旅程，以及那些短暫成為其中一部分的人們。這件作品不只是一系列肖像，更記錄了轉瞬即逝的連結，以及一件不尋常的物件如何暫時改變陌生人之間、人與周遭環境之間的關係。",
    "本計畫也是一個持續發展系列的起點。未來，藝術家將在每個地方創作一朵新的花，從當地的材料、視覺文化與社會脈絡中汲取靈感。每一朵花都將成為新相遇的起點，讓作品透過所接觸的人與地方持續演變。"
   ],
   [
    "This project began with the making of an oversized flower from paper and papier-mâché. Rather than remaining confined to the exhibition space, the flower was carried through the city, becoming a performative object and a pretext for social interaction.",
    "Walking through different neighbourhoods and everyday spaces, the artist invited strangers to pose alongside the flower, encouraging spontaneous encounters and unexpected photographic situations. Participants were free to choose their poses, suggest locations or invent their own scenarios, allowing each interaction to shape the project in its own way. A bilingual sign in English and Chinese introduced the project to passers-by, inviting them to take part.",
    "Initially apprehensive about how people would react, the artist gradually discovered an unexpected openness and generosity. Curiosity, laughter, compliments and spontaneous participation transformed the experience into a way of discovering Taipei beyond the usual perspective of a tourist. The process itself became part of the adventure, as the flower's unusual size led to improvised solutions, helpful encounters and unexpected detours throughout the city.",
    "The resulting photographs, printed on aluminium, form a visual diary of the flower's journey and the people who briefly became part of it. More than a collection of portraits, the work documents fleeting connections and the ways an unusual object can temporarily transform relationships between strangers and their surroundings.",
    "This project marks the beginning of an ongoing series in which a new flower will be created for each place, drawing inspiration from its local materials, visual culture and social context. Each flower will become a starting point for new encounters, allowing the work to evolve through the people and places it engages with."
   ]

    "這幅壁畫的靈感來自 Thea Macera 在夏季與臺北的相遇。這是一個天氣變幻莫測、豪雨與颱風頻繁、濕氣難耐的季節。來自法國的她，一開始難以適應這種與家鄉截然不同的熱帶氣候。",
    "然而，在這些氣候挑戰之外，城市中無所不在的自然景觀也令她深受震撼。繁茂的植物、盛開的花朵與茂密的森林，和都市環境共存，形成城市與自然彼此交織的風景。",
    "壁畫描繪了兩朵飽含雨水的雲，但雲朵灑落的不是雨水，而是花朵。這個簡單的轉化，映照出她對臺北的認識過程：起初令人難以招架、感到陌生的一切，逐漸成為令人著迷的來源。花朵代表當地豐富的植物生態，雲朵則喚起那些形塑她初次城市經驗的多變天氣。",
    "鮮明的色彩也是對臺北繽紛街道、創意精神與視覺活力的致敬。Thea Macera 沒有選擇細緻描繪城市，而是以一個簡單、富有趣味的畫面，結合這段經驗中兩個對比鮮明的面向：熱帶氣候的強烈，以及周遭植物的美好。",
    "這幅壁畫是她對這段臺灣經驗的個人詮釋，呈現出適應陌生環境的過程，以及在起初看似艱難的事物中發現美的歷程。"
   ],
   [
    "This mural was inspired by Thea Macera's encounter with Taipei during the summer, a season marked by unpredictable weather, torrential rain, typhoons and overwhelming humidity. Coming from France, she found it challenging to adapt to this tropical climate, which was so different from what she was used to.",
    "Yet, alongside these climatic challenges, she was struck by the extraordinary presence of nature throughout the city. Lush vegetation, abundant flowers and dense forests coexist with the urban environment, creating a landscape where the city and nature seem to intertwine.",
    "The mural depicts two rain-filled clouds, but instead of releasing water, they shower the ground with flowers. This simple transformation reflects her discovery of Taipei: what initially felt overwhelming and unfamiliar gradually became a source of fascination. The flowers represent the richness of the local flora, while the clouds evoke the unpredictable weather that shaped her first experience of the city.",
    "The vibrant colour palette is also a tribute to Taipei's colourful streets, creative spirit and visual energy. Rather than offering a detailed representation of the city, Macera chose a simple and playful image that brings together two contrasting aspects of her experience: the intensity of the tropical climate and the beauty of the surrounding vegetation.",
    "This mural is a personal interpretation of her encounter with Taiwan. It reflects the process of adapting to an unfamiliar environment and discovering beauty in what first seems difficult."

  "desc": [
   [
    "這件壁畫喚起了 madkidgenius 濃厚的個人懷舊情感：在臺灣南部度過的童年遊戲時光、彷彿永無止境的下課時間，以及 1990 年代末期在公園裡消磨的漫長午後。那時，巨大的水泥大象溜滑梯隨處可見。在不同文化之間生活、走遍世界多年後，他回到臺灣，才發現這些具代表性的遊具已逐漸從城市風景中消失，悄悄地走向滅絕。",
    "與這座粗獷主義風格遊樂場的相遇，讓所有童年記憶瞬間湧現。遊樂場坐落於臺北歷史悠久的條通商圈，這個街區從日治時期仿照棋盤格局規劃的街道，逐漸發展成充滿活力的夜生活重鎮。對藝術家而言，一頭棋盤格紋的大象，正是串連過去與現在的最佳橋梁。在亞洲各地的傳統中，大象象徵力量與穩定，也讓這件作品成為向陪伴一代代孩子成長的經典遊具致敬的最佳方式。",
    "在視覺呈現上，madkidgenius 選擇不遮蓋遊樂場原始的水泥表面。他一直深受 1950 年代粗獷主義（Brutalism）與清水混凝土（béton brut）那種未經修飾、厚重質感的吸引。他以多種戶外壓克力顏料，將鮮明而充滿能量的色彩直接塗繪在歷經風霜的水泥上，讓藝術與場域本身的自然紋理共存。",
    "最終，這件作品是藝術家回到創作初衷的一段個人旅程：對純藝術、流行文化與趣味敘事的熱愛。他將逐漸消逝的在地記憶，疊上一層大膽而嶄新的色彩，為公園創造一個有趣的打卡點，讓年長的世代在此緬懷過往，也讓新一代的孩子盡情玩耍。"
   ],
   [
    "This mural taps into a strong wave of personal nostalgia for madkidgenius: childhood playtimes in southern Taiwan, endless school recesses, and long late-’90s afternoons in the park. Back then, massive concrete elephant slides were everywhere. After years of living across different cultures and traveling the world, he returned home to Taiwan and realized how these iconic structures had slowly faded from the landscape, quietly drifting toward extinction.",
    "Encountering this brutalist playground brought all those core memories rushing back. The playground sits in Taipei’s historic Tiaotong district, a neighborhood that evolved from a Japanese-era grid inspired by a chessboard pattern into a dynamic nightlife hub. For the artist, a checkered elephant felt like the perfect bridge. Across Asian traditions, the elephant stands for strength and stability, making it a fitting tribute to the classic play structures that anchored generations of kids.",
    "Visually, madkidgenius chose not to mask or cover up the playground’s raw concrete surface. He has always been drawn to the unrefined, heavy weight of 1950s Brutalism and béton brut. Using a mix of exterior acrylics, he applied vibrant, high-energy colors directly onto the weathered concrete, allowing the art and the site’s natural texture to coexist.",
    "Ultimately, this piece is the artist’s personal loop back to what started it all: a love for fine art, pop culture, and playful storytelling. It takes a fading piece of local memory and adds a bold, fresh layer to the park, creating a fun checkpoint where older generations can reminisce and new kids can simply enjoy playing."
   ]

/* 展出地點連到 Google 地圖，開新分頁。有門牌或巷號的地址用直接標點；地名用搜尋；
   同名地點有好幾個的，指定 Google 地點代號（2026-10-27 逐一在 Google 地圖查過：華山公園搜出兩個同名，指定市民大道那個）。
   地點沒寫城市的補「臺北市」，不補區名，區由 Google 判斷（赤峰街47巷2號實際在大同區） */
const PLACE_ID = {'華山公園': 'ChIJXak7OW6pQjQR1S6DrtUOxl8'};
function mapUrl(loc){
  const q = /^(臺北|台北)/.test(loc) ? loc : '臺北市' + loc;
  if(/[0-9０-９]\s*(號|巷|弄)/.test(loc)) return 'https://www.google.com/maps/place/' + encodeURIComponent(q);
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) + (PLACE_ID[loc] ? '&query_place_id=' + PLACE_ID[loc] : '');
}
/* 影像作品的影片格：試算表「影片連結」給了幾支網址就幾格；還沒給網址的放一格「影片準備中」 */
const videoSlots = w => !w.video ? [] : (w.videos || []).length ? w.videos : [null];
const vidLab = (k, n) => `${SITE.vid[0]} ${SITE.vid[1]}${n > 1 ? ` ${k + 1} / ${n}` : ''}`;
/* YouTube（watch、youtu.be、shorts、live）轉成 youtube-nocookie 的嵌入網址，Vimeo 轉成 player.vimeo.com；其他網址回傳空字串，改成開新分頁 */
function embedUrl(u){
  let m = String(u).match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(m) return `https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0&playsinline=1`;
  m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? `https://player.vimeo.com/video/${m[1]}?autoplay=1` : '';
}
/* 影片格中間的白卡：有可嵌入的網址才寫「點了直接播放」；沒有網址寫「影片準備中」，不能點 */

  if(!u) return `<span class="play"><b>▶</b><span>${tm}<br>${SITE.videoSoon[0]} <span lang="en">${SITE.videoSoon[1]}</span></span></span>`;

  return e ? `<button class="play sel" type="button" data-play="${esc(e)}"><b>▶</b><span>${tm}<br>${SITE.video[0]} <span lang="en">${SITE.video[1]}</span></span></button>`

/* ===== 出現與解碼 ===== */
const GL = '+=|/_<>[]{}*#&:;~^';
function scramble(el){
  const fin = el.dataset.txt || (el.dataset.txt = el.textContent);
  if(RM){ el.textContent = fin; return; }
  const ch = [...fin], N = ch.length, total = Math.min(34, 12 + N * .7);
  let f = 0;
  el.style.display = el.style.display || 'inline-block';
  el.style.minWidth = el.offsetWidth + 'px';
  const tick = () => {
    f++;
    const k = (f / total) * N;
    el.textContent = ch.map((c, i) => i < k || !/[\x21-\x7e]/.test(c) ? c : GL[(Math.random() * GL.length) | 0]).join('');
    if(f < total) setTimeout(tick, 34); else { el.textContent = fin; el.style.minWidth = ''; }
  };
  tick();
}
let io = null;
function initReveal(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    e.target.classList.add('in');
    $$('[data-scr]', e.target).forEach(scramble);
    if(e.target.matches('[data-scr]')) scramble(e.target);
    io.unobserve(e.target);
  }), {rootMargin: '0px 0px -8% 0px'});
  $$('.rv, .crumb[data-scr]').forEach(el => io.observe(el));
}
/* 字母被游標碰到會跳一下，像在畫布上被推動的字 */
function initLetters(){
  if(!FINE) return;
  $$('.lt').forEach(el => {
    el.addEventListener('pointerenter', () => {
      if(el.classList.contains('hit')) return;
      el.classList.add('hit');
      el.style.transform = `translateY(-${8 + Math.random() * 10}%) rotate(${(Math.random() * 14 - 7).toFixed(1)}deg)`;
      setTimeout(() => { el.style.transform = ''; el.classList.remove('hit'); }, 700);
    });
  });
}

/* ===== 主視覺：可拖曳的貝茲錨點、標題捲動、標籤 ===== */
let heroLoop = 0;
function initHero(){
  cancelAnimationFrame(heroLoop);
  const box = $('#heroTitle'), inC = $('#inC'), anc = $('#eAnc'), path = $('#bezP'), hdl = $('#hdl'), edit = $('#hEdit');
  const stick = $('#heroStick'), hero = $('#top');
  const P = {x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0, drag: false};
  function anchors(){
    const b = box.getBoundingClientRect(), c = inC.getBoundingClientRect(), e = anc.getBoundingClientRect();
    return {sx: c.right - b.left, sy: c.top + c.height / 2 - b.top, tx: e.left + e.width * .5 - b.left, ty: e.top + e.height * .2 - b.top};
  }
  let A = anchors();
  P.x = A.tx; P.y = A.ty;
  function draw(){
    const sx = A.sx, sy = A.sy, hx = P.x, hy = P.y;
    path.setAttribute('d', `M${sx},${sy} C${sx + (hx - sx) * .62},${sy} ${hx},${sy + (hy - sy) * .28} ${hx},${hy}`);
    hdl.style.transform = `translate(${hx}px,${hy}px)`;
    edit.style.transform = `translate(${hx + 16}px,${hy + 12}px)`;
  }
  hdl.addEventListener('pointerdown', e => {
    e.preventDefault(); hdl.setPointerCapture(e.pointerId); P.drag = true; hdl.classList.add('dragging');
    const b = box.getBoundingClientRect(); P.ox = e.clientX - b.left - P.x; P.oy = e.clientY - b.top - P.y;
  });
  hdl.addEventListener('pointermove', e => {
    if(!P.drag) return;
    const b = box.getBoundingClientRect();
    P.x = e.clientX - b.left - P.ox; P.y = e.clientY - b.top - P.oy; P.vx = P.vy = 0;
  });
  const up = () => { P.drag = false; hdl.classList.remove('dragging'); };
  hdl.addEventListener('pointerup', up); hdl.addEventListener('pointercancel', up);
  /* 副標每一行字的字框（相對首屏、扣掉捲動造成的位移），給三維那邊的標籤避開用 */
  const measureSub = () => {
    const st = stick.getBoundingClientRect(), off = new DOMMatrix(getComputedStyle(box).transform).m42 || 0, L = [];
    const tw = document.createTreeWalker($('.hero-sub', box), NodeFilter.SHOW_TEXT);
    for(let n = tw.nextNode(); n; n = tw.nextNode()){
      const r = document.createRange(); r.selectNodeContents(n);
      [...r.getClientRects()].forEach(b => L.push({l: b.left - st.left, r: b.right - st.left, t: b.top - st.top - off, b: b.bottom - st.top - off}));
    }
    window.FIT.subLines = L;
    if(window.FITGL && window.FITGL.refit) window.FITGL.refit();   /* 字一換字型、行寬就變，資料夾位置跟著重算 */
  };
  measureSub();
  const signal = pageAC.signal;
  window.addEventListener('resize', () => { A = anchors(); measureSub(); }, {passive: true, signal});
  if(document.fonts){
    document.fonts.ready.then(() => { if(!signal.aborted){ A = anchors(); P.x = A.tx; P.y = A.ty; measureSub(); } });
    document.fonts.addEventListener('loadingdone', () => { A = anchors(); measureSub(); }, {signal});
  }
  const tags = [$('#tagMain'), $('#tagA'), $('#tagB')].filter(Boolean);
  window.FIT.tags = tags;
  const loop = () => {
    heroLoop = requestAnimationFrame(loop);
    if(!document.body.contains(box)) { cancelAnimationFrame(heroLoop); return; }
    if(!P.drag){   /* 放手後彈回原位 */
      P.vx = (P.vx + (A.tx - P.x) * .09) * .8; P.vy = (P.vy + (A.ty - P.y) * .09) * .8;
      P.x += P.vx; P.y += P.vy;
    }
    draw();
    const r = hero.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / Math.max(1, r.height - innerHeight)));
    window.FIT.heroP = p;
    /* 標題跟資料夾用同一個進度：標題完全出現的那一刻，資料夾也剛好闔回原位 */
    box.style.transform = `translate3d(0,${(-p * window.FIT.TITLE_DROP * 100).toFixed(2)}vh,0)`;
    box.style.opacity = (1 - p).toFixed(3);
  };
  loop();
}

function initTether(){
  const head = $('#apHead');

  const ring = $('.ring', head), name = $('#apName'), path = $('#tetP'), hdl = $('#tetH'), signal = pageAC.signal;

  ring.addEventListener('pointerleave', () => ring.classList.remove('color'));
  const P = {x: 0, y: 0, vx: 0, vy: 0, drag: false};
  let A;
  const anchors = () => {
    const b = head.getBoundingClientRect(), c = ring.getBoundingClientRect(), n = name.getBoundingClientRect();
    A = {sx: c.right - b.left + 10, sy: c.top + c.height * .5 - b.top, tx: n.left - b.left - 14, ty: n.top - b.top + n.height * .15};
  };

  hdl.addEventListener('pointerdown', e => { e.preventDefault(); hdl.setPointerCapture(e.pointerId); P.drag = true; hdl.classList.add('dragging'); });
  hdl.addEventListener('pointermove', e => { if(!P.drag) return; const b = head.getBoundingClientRect(); P.x = e.clientX - b.left; P.y = e.clientY - b.top; });
  const up = () => { P.drag = false; hdl.classList.remove('dragging'); };
  hdl.addEventListener('pointerup', up); hdl.addEventListener('pointercancel', up);

    path.setAttribute('d', `M${A.sx},${A.sy} C${A.sx + (P.x - A.sx) * .5},${A.sy} ${P.x - 40},${P.y} ${P.x},${P.y}`);
    hdl.style.transform = `translate(${P.x}px,${P.y}px)`;
  };
  loop();
}

/* ===== 作品內頁：作品圖切換（點縮圖、左右拖、方向鍵） ===== */
function initGallery(){
  const g = $('#gmain');
  if(!g) return;
  /* 前 nV 格是影片（videoSlots），後面是作品圖；k 是格數，作品圖用 k - nV 去 P 裡取 */
  const n = +g.dataset.n, nV = +g.dataset.v || 0, i = +g.dataset.i, lab = $('#glab'), th = $('#gthumbs'), img = $('#gimg'), gv = $('#gvid');
  const W = WORKS[i], P = W.pics || [], tm = titleMain(W), VS = videoSlots(W);
  /* 點白卡才把播放器嵌進來；換到別格時整層清掉，影片跟著停 */
  if(gv) gv.addEventListener('click', e => {
    const b = e.target.closest('[data-play]');
    if(!b) return;
    const f = document.createElement('iframe');
    f.src = b.dataset.play; f.title = tm; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    b.replaceWith(f);
    g.classList.add('playing');
  });
  if(n < 2) return;
  let k = 0;
  /* 換圖與預抓都用同一組 sizes＋srcset，瀏覽器挑到的跟主圖同一個檔，預抓的才會被用上 */
  const pick = (el, p) => { el.sizes = picSizes(p); el.srcset = p.set; el.src = p.src; };
  const preload = j => { const p = P[(j + P.length) % P.length]; if(p) pick(new Image(), p); };
  const show = j => {
    k = (j + n) % n;
    g.classList.remove('playing');
    if(k < nV){
      gv.innerHTML = playCard(W, VS[k]);
      gv.hidden = false;
      if(img) img.classList.add('off');
      lab.textContent = vidLab(k, nV);
    } else {
      const p = k - nV;
      if(gv){ gv.hidden = true; gv.innerHTML = ''; }
      if(img && P[p]){
        img.classList.remove('off');
        img.classList.add('fade');
        const next = new Image();
        next.onload = () => { pick(img, P[p]); img.alt = `${tm} ${SITE.img} ${p + 1}`; img.classList.remove('fade'); };
        pick(next, P[p]);
        preload(p + 1);
      } else g.style.setProperty('--g', grad(i, (180 + p * 50) + 'deg'));
      lab.textContent = `${SITE.img} ${p + 1} / ${n - nV}`;
    }
    if(th) $$('button', th).forEach((b, x) => { b.classList.toggle('on', x === k); if(x === k && (P.length || nV)) b.scrollIntoView({block: 'nearest', inline: 'nearest', behavior: RM ? 'auto' : 'smooth'}); });
  };
  /* 第一張下載完才預抓第二張，不跟第一張搶頻寬 */
  if(P.length){ if(img.complete) preload(1); else img.addEventListener('load', () => preload(1), {once: true, signal: pageAC.signal}); }
  addEventListener('resize', () => { const p = P[k - nV]; if(img && p) img.sizes = picSizes(p); }, {signal: pageAC.signal});
  if(th) th.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if(b) show(+b.dataset.k); });
  g.addEventListener('click', e => { const b = e.target.closest('.gnav'); if(b) show(k + (b.classList.contains('next') ? 1 : -1)); });
  let sx = null;
  g.addEventListener('pointerdown', e => { if(!e.target.closest('.gnav')) sx = e.clientX; });
  g.addEventListener('pointerup', e => { if(sx == null) return; const d = e.clientX - sx; sx = null; if(Math.abs(d) > 40) show(k + (d < 0 ? 1 : -1)); });
  /* 在留言欄打字時方向鍵是移游標，不換圖 */
  document.onkeydown = e => { if(!document.body.contains(g) || e.target.closest('input, textarea')) return; if(e.key === 'ArrowRight') show(k + 1); if(e.key === 'ArrowLeft') show(k - 1); };
}

function initComments(){
  const sec = $('#cm');

  const w = sec.dataset.w, list = $('#cmList'), num = $('#cmN'), st = $('#cmSt'), form = $('#cmForm'), btn = $('.cm-send', form), f = form.elements;
  const sig = pageAC.signal;

  const when = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('sv-SE', {timeZone: 'Asia/Taipei', hour12: false}).slice(0, 16); };
  const note = p => `<li class="cm-empty">${bil(p)}</li>`;

    list.innerHTML = items.length ? items.map(c => `<li><div class="cm-h"><b>${esc(c.n)}</b><time>${esc(when(c.t))}</time></div><p>${esc(c.m)}</p></li>`).join('') : note(SITE.cmNone);
  };

  fetch(COMMENTS_API + '?w=' + encodeURIComponent(w), {signal: sig})

    .then(d => { if(!d.ok) throw new Error(d.err); items = d.items || []; draw(); })

  form.addEventListener('submit', e => {

    say(SITE.cmSending);

    fetch(COMMENTS_API, {method: 'POST', body: JSON.stringify({w, n, m, hp: f.hp.value}), signal: sig})
      .then(r => r.json())

      .catch(err => { if(sig.aborted) return; console.error('留言送出失敗', err); say(SITE.cmFail); })

  }, {signal: sig});
}

/* ===== 選取框：像在繪圖軟體裡點到一個物件 ===== */
const Sel = (() => {
  const el = $('#sel'), wh = $('#selWh');

    el.style.width = (r.width + p * 2) + 'px'; el.style.height = (r.height + p * 2) + 'px';

  let raf = 0;
  const follow = () => { if(!cur){ raf = 0; return; } if(!document.body.contains(cur)){ api.hide(); raf = 0; return; } place(cur); raf = requestAnimationFrame(follow); };
  const api = {
    show(t){ if(!FINE) return; cur = t; place(t); el.classList.add('on'); if(!raf) raf = requestAnimationFrame(follow); },

})();

/* ===== 背景字元層：海報上的程式註解，內容取自本站資料；游標經過會被攪亂 ===== */
const Ascii = (() => {
  const cv = $('#ascii'), cx = cv.getContext('2d');
  let W = 0, H = 0, D = 1, fs = 11, adv = 8.4, lh = 19, blocks = [], L = 1, mx = -1e4, my = -1e4, dirty = true, hot = 0, spin = 0;
  function src(){
    const out = [
      ['|', '|  [+][+][+][+][+][+]  /* STREET_GRID */', '|  [+][ ][+][ ][+][ ]', '|  [+][+][+][+][+][+]  // CROSSING...', '|  [ ][+][ ][+][ ][+]', '|  [+][+][+][+][+][+]', '|'],
      ['> PATH: ./home/IEGO_ART/File_in_Taipei/', `> CALL_OPEN: [${YEAR}_COLLECTION]`],
      [`/* STATUS: ${pad(ARTISTS.length)}_ARTISTS / ${pad(WORKS.length)}_WORKS */`],
      ['   _________', '  /         \\_______________', ' |  FILE_IN_TAIPEI  ' + YEAR + '    |', ' |   _  _  _  _  _  _  _  _  |', ' |  |W||W||W||W||W||W||W||W| |', ' |___________________________|'],
      ['/* Access_Level: [UNRESTRICTED] */'],
      ['> @@SPIN@@_processing_', '> [=]_DONE_'],
      ['/* END_TRANSMISSION */'],
    ];
    WORKS.forEach(w => {
      const l = ['> SUBMIT: {', `>   File: "${w.id}_${U(w.title[1] || w.title[0])}",`];
      w.meta.forEach(m => { const v = m[3] || (lat(m[2]) ? m[2] : ''); if(v) l.push(`>   ${U(m[1])}: "${U(v)}",`); });
      l.push('> }');
      out.push(l);
    });
    ARTISTS.forEach(a => out.push([`/* ${a.id} :: ${U(a.name)}${a.born ? ' // b.' + a.born : ''}${a.nat && a.nat[1] ? ' // ' + U(a.nat[1]) : ''} */`]));
    return out;
  }
  function seeded(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function build(){
    const rnd = seeded(2026), S = src();
    for(let i = S.length - 1; i > 0; i--){ const j = (rnd() * (i + 1)) | 0; [S[i], S[j]] = [S[j], S[i]]; }
    const cols = W < 821 ? [8, W * .58] : [14, W * .36, W * .72];
    const ys = cols.map(() => 90 + rnd() * 120);
    blocks = S.map((lines, i) => {
      const c = i % cols.length;
      const b = {x: cols[c] + (rnd() * 40 | 0), y: ys[c], lines, lav: rnd() < .3};
      ys[c] += lines.length * lh + 40 + rnd() * 120;
      return b;
    });
    L = Math.max(...ys) + 120;
  }
  function size(){
    D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * D; cv.height = H * D; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    fs = W < 821 ? 10 : 11; adv = fs * .78; lh = fs * 1.75;
    build(); dirty = true;
  }
  function draw(now){
    requestAnimationFrame(draw);
    if(now - spin > 320){ spin = now; dirty = true; }
    if(!dirty && now > hot) return;
    dirty = false;
    cx.setTransform(D, 0, 0, D, 0, 0);
    cx.clearRect(0, 0, W, H);
    cx.font = `300 ${fs}px Jost, sans-serif`;
    cx.textBaseline = 'middle';
    const sy = (window.scrollY || 0) * .35, R = 74, R2 = R * R, sp = ['[ ]', '[|]', '[=]'][((now / 320) | 0) % 3];
    const tg = (now / 70) | 0;
    for(const b of blocks){
      let by = ((b.y - sy) % L + L) % L - 40;
      if(by > H + 40 || by + b.lines.length * lh < -40) continue;
      const k = W < 821 ? .55 : 1, base = b.lav ? `rgba(144,141,196,${.62 * k})` : `rgba(150,200,202,${.78 * k})`;
      for(let li = 0; li < b.lines.length; li++){
        const s = b.lines[li].replace('@@SPIN@@', sp), py = by + li * lh;
        if(py < -20 || py > H + 20) continue;
        const near = Math.abs(py - my) < R;
        if(!near){ cx.fillStyle = base; for(let j = 0; j < s.length; j++){ if(s[j] !== ' ') cx.fillText(s[j], b.x + j * adv, py); } continue; }
        for(let j = 0; j < s.length; j++){
          if(s[j] === ' ') continue;
          const px = b.x + j * adv, dx = px - mx, dy = py - my, d2 = dx * dx + dy * dy;
          if(d2 < R2){
            const q = 1 - Math.sqrt(d2) / R;
            cx.fillStyle = q > .55 ? `rgba(198,48,121,${.5 + q * .5})` : `rgba(34,76,136,${.35 + q})`;
            cx.fillText(GL[(j * 7 + li * 13 + tg) % GL.length], px + (Math.sin(tg + j) * q * 2), py);
          } else { cx.fillStyle = base; cx.fillText(s[j], px, py); }
        }
      }
    }
  }
  window.addEventListener('resize', size, {passive: true});
  window.addEventListener('scroll', () => { dirty = true; }, {passive: true});
  if(FINE) window.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; dirty = true; hot = performance.now() + 700; }, {passive: true});
  return {start(){ size(); requestAnimationFrame(draw); }};
})();

<script type="module" onerror="window.FITBOOT.mark('gl', '—')">
/* 首頁三維資料夾：十張頁從書背底端同一點展開，滑鼠翻動、捲動打開。頁只是畫面，不對應任何一件作品 */
import * as THREE from 'three';
const F = window.FIT;
const N = F.WORKS.length;
const v3 = h => new THREE.Vector3(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255);
const PW = 3.7, PH = 5.1, CW = 4.5, CH = 5.6;

const NOISE = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y); }`;
/* 頁沿書背捲成一段圓柱面：底端不捲、越往上捲越多，十張頁的底邊都是直線，收在同一點；上緣有一點點飄動 */
const VERT = `
uniform float uCurl, uTime, uW, uH;
varying vec2 vUv; varying float vShade;
void main(){
  vUv = uv;
  vec3 p = position;
  float k = uCurl * pow(p.y / uH, 1.3);
  if(abs(k) > 1e-4){ float R = uW / k, th = p.x / R; p.x = R * sin(th); p.z = R * (1. - cos(th)); vShade = sin(th); }
  else vShade = 0.;
  p.z += sin(uTime * 1.1 + uv.y * 3. + uv.x * 2.) * .012 * uv.x * uv.y;

const FRAG = `
uniform vec3 uC0, uC1, uC2, uC3;
uniform float uTime, uSeed, uBand;
varying vec2 vUv; varying float vShade;
${NOISE}
vec3 grad(float t){ t = clamp(t, 0., 1.);
  if(t < .333) return mix(uC0, uC1, t * 3.); if(t < .666) return mix(uC1, uC2, (t - .333) * 3.); return mix(uC2, uC3, (t - .666) * 3.); }
void main(){
  vec2 uv = vUv;
  float n = noise(uv * vec2(2.5, 5.) + vec2(uSeed, uTime * .07));
  vec3 col = grad(1. - uv.y + (n - .5) * .32 + sin(uTime * .22 + uSeed) * .07);
  if(!gl_FrontFacing) col = mix(col, vec3(1.), .5);
  float g = hash(floor(uv * vec2(900., 1300.)) + floor(uTime * 8.) * 1.31);
  float band = uBand * (1. - smoothstep(.0, .09, uv.x));
  vec3 duo = mix(vec3(.18, .48, .33), vec3(.94, .76, .88), step(.52, g * .55 + noise(uv * vec2(60., 140.)) * .55));
  col = mix(col, duo, band);

  float d = min(min(uv.x, 1. - uv.x) / fw.x, min(uv.y, 1. - uv.y) / fw.y);

const POOL_F = `
uniform float uTime; uniform vec2 uM;
varying vec2 vUv;
${NOISE}
vec3 pal(float t){
  vec3 a = vec3(.83, .84, .93), b = vec3(.56, .66, .87), c = vec3(.94, .49, .24), d = vec3(.58, .83, .93);
  t = fract(t) * 4.;
  if(t < 1.) return mix(a, b, t); if(t < 2.) return mix(b, c, t - 1.); if(t < 3.) return mix(c, d, t - 2.); return mix(d, a, t - 3.);
}
void main(){
  vec2 q = (vUv - .5) * 2.;
  float e = length(q);
  float a = 1. - smoothstep(.9, 1., e);
  float n = noise(vUv * vec2(3., 1.6) + uTime * .04);
  float r = length(vUv - uM);
  float t = vUv.x * .75 - vUv.y * .35 + n * .35 + uTime * .025 + sin(r * 26. - uTime * 2.4) * .03 * exp(-r * 5.);
  vec3 col = pal(t);
  col += (hash(floor(gl_FragCoord.xy * .7) + floor(uTime * 12.)) - .5) * .09;

let R = null, scene, cam, root, pool, pages = [], front, back, host = null, raf = 0, vis = false, ioV = null, roV = null, handles = [];
const ptr = {x: .2, y: 0, tx: .2, ty: 0, px: -1, py: -1, inside: false};
let prog = 0;
const tmp = new THREE.Vector3();
const t0 = performance.now();

function folderShape(w, h){
  const s = new THREE.Shape(), y = h / 2;
  s.moveTo(0, -y); s.lineTo(w, -y); s.lineTo(w, y); s.lineTo(w * .64, y); s.lineTo(w * .59, y + .34); s.lineTo(w * .24, y + .34); s.lineTo(w * .19, y); s.lineTo(0, y); s.lineTo(0, -y);
  return s;
}
function cover(w, h){
  const shp = folderShape(w, h);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(shp), new THREE.MeshBasicMaterial({color: 0xffffff, side: THREE.DoubleSide}));
  const pts = shp.getPoints().map(p => new THREE.Vector3(p.x, p.y, .004));
  const ln = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: 0x8fcad2}));
  const g = new THREE.Group(); g.add(m, ln);
  return g;
}
function init(){
  R = new THREE.WebGLRenderer({antialias: true, alpha: true, powerPreference: 'high-performance'});
  R.setPixelRatio(Math.min(devicePixelRatio || 1, F.FINE ? 1.75 : 1.5));
  R.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  cam = new THREE.PerspectiveCamera(30, 1, .1, 100);
  root = new THREE.Group(); scene.add(root);
  back = cover(CW * .96, CH * .97); root.add(back);
  front = cover(CW, CH); root.add(front);
  /* 十張頁同一個尺寸、樞紐都在左下角：底邊從書背底端同一點散開，收得整齊 */
  const g = new THREE.PlaneGeometry(PW, PH, 32, 24);
  g.translate(PW / 2, PH / 2, 0);
  for(let i = 0; i < N; i++){
    const pal = F.SHEETS[i % F.SHEETS.length];
    const m = new THREE.ShaderMaterial({
      uniforms: {uC0: {value: v3(pal[0])}, uC1: {value: v3(pal[1])}, uC2: {value: v3(pal[2])}, uC3: {value: v3(pal[3])},
        uTime: {value: 0}, uSeed: {value: i * 1.73}, uBand: {value: F.BAND[i] || 0},
        uCurl: {value: .3}, uW: {value: PW}, uH: {value: PH}},
      vertexShader: VERT, fragmentShader: FRAG, side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(g, m);
    const piv = new THREE.Group(); piv.add(mesh); root.add(piv);
    pages.push({piv, mesh, m, a: 0});
  }
  pool = new THREE.Mesh(new THREE.PlaneGeometry(13, 6.4), new THREE.ShaderMaterial({
    uniforms: {uTime: {value: 0}, uM: {value: new THREE.Vector2(.5, .5)}},
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
    fragmentShader: POOL_F, transparent: true, depthWrite: false,

}
const CFG = {fov: 34, camX: 1, camY: 1.4, camZ: 14.5, rx: .1, ry: -.15, rz: -.12, a0: .32, a1: .66, a0o: .14, a1o: .9, fanZ: .28, curl: .5, bx: 2.2, by: -.2, mx: .5, my: -4.6, edge: .88};
/* 資料夾有兩種擺法：放在首屏大標與副標的右邊（side），或放到字的下方。每次版面變動兩種都擺一次，
   取資料夾在畫面上比較寬的那一種；放右邊的那種要不碰字、也不超出右側界線才算數。
   用實際放得下多大來選，不用畫面長寬比：直式平板與接近正方形的視窗，字的右邊其實還很空 */
let side = true;
function layoutFor(w, h){
  const asp = w / h, C = CFG;
  cam.fov = C.fov; cam.aspect = asp; cam.updateProjectionMatrix();
  if(side){ cam.position.set(C.camX, C.camY, C.camZ); root.scale.setScalar(Math.min(1.06, .78 + asp * .14)); root.userData.base = new THREE.Vector3(C.bx * Math.min(1, asp / 1.7), C.by, 0); }
  else { cam.position.set(.4, 1.2, C.camZ + 2); root.scale.setScalar(.38 + asp * .2); root.userData.base = new THREE.Vector3(C.mx, C.my, 0); }
  cam.lookAt(root.userData.base.x * .55, root.userData.base.y * .7, 0);
  cam.updateMatrixWorld();
}
/* 放在字右邊時，資料夾右緣不超過畫面寬的 edge（八成八）、也不壓到右邊的 # 號；超過就整個等比縮小再重擺，三輪內收斂。
   回傳最後放不放得進去 */
function shrinkToRoom(){
  const W = host.clientWidth, ck = host.parentElement && host.parentElement.querySelector('.checker');
  const lim = Math.min(W * CFG.edge, ck && ck.offsetWidth ? ck.offsetLeft - 8 : W);
  const right = () => { pose(0, .2, 0, false, false); return Math.max(...pagesHull().map(p => p[0])); };
  for(let i = 0; i < 3 && right() > lim + 2; i++){
    const xs = pagesHull().map(p => p[0]), l = Math.min(...xs), r = Math.max(...xs);
    root.scale.multiplyScalar(Math.max(.6, (lim - l) / (r - l)));
    fitShift();
  }
  return right() <= lim + 2 && !hitsText();
}
function tryLayout(s, w, h){
  side = s;
  layoutFor(w, h);
  fitShift();
  const ok = s ? shrinkToRoom() : true;
  pose(0, .2, 0, false, false);
  const xs = pagesHull().map(p => p[0]);
  return ok ? Math.max(...xs) - Math.min(...xs) : 0;
}
function arrange(){
  const w = host.clientWidth, h = host.clientHeight;
  if(!w || !h) return;
  const atSide = tryLayout(true, w, h), below = tryLayout(false, w, h);
  if(atSide >= below) tryLayout(true, w, h);
}
function resize(){
  if(!host) return;
  const w = host.clientWidth, h = host.clientHeight;
  if(!w || !h) return;
  R.setSize(w, h, false);
  arrange();
}
/* 畫面收窄時整個資料夾往右移：在靜止姿勢下把十張彩色頁投影到螢幕取外框，
   外框碰到首屏副標（桃紅字與日期）的任何一行就往右移，移到剛好不碰為止；放在字右邊時，整塊大標與副標的範圍也不准碰（容許右緣 12px 的交疊）。
   最多移到頁扇右緣超出畫面一成，再多就停在那裡，剩下的交給標籤自己讓開。白色封面不算，它本來就墊在字後面 */
let shiftX = 0;
function hull(pts){
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for(const p of pts){ while(lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function pagesHull(){
  root.updateMatrixWorld(true);
  const pts = [];
  pages.forEach(P => { const g = P.mesh.geometry.parameters; [[0, 0], [0, g.height], [g.width, 0], [g.width, g.height], [g.width / 2, g.height], [g.width / 2, 0], [g.width, g.height / 2]].forEach(([x, y]) => pts.push(proj(P.mesh, x, y, 0))); });
  return hull(pts);
}
function hitsText(){
  const L = F.subLines;
  if(!L || !L.length) return false;
  const H = pagesHull();
  if(L.some(r => sat(H, [[r.l - 6, r.t], [r.r + 6, r.t], [r.r + 6, r.b], [r.l - 6, r.b]]))) return true;
  const t = side && document.getElementById('heroTitle');
  if(!t) return false;
  const x0 = t.offsetLeft, y0 = t.offsetTop, x1 = x0 + t.offsetWidth - 12, y1 = y0 + t.offsetHeight;
  return sat(H, [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
}
function fitShift(){
  shiftX = 0;
  if(!host || !F.subLines || !F.subLines.length) return;
  pose(0, .2, 0, false, false);
  if(!hitsText()) return;
  const W = host.clientWidth, tooFar = () => Math.max(...pagesHull().map(p => p[0])) > W * 1.1;
  let lo = 0, hi = 0;
  for(let s = .25; s <= 6; s += .25){ shiftX = s; pose(0, .2, 0, false, false); if(!hitsText()){ hi = s; break; } if(tooFar()){ hi = -s; break; } lo = s; }
  if(hi < 0){ shiftX = lo; return; }   /* 推到上限還碰得到：停在不超出畫面的最遠處 */
  if(hi === 0){ shiftX = lo; return; }
  for(let k = 0; k < 8; k++){ const m = (lo + hi) / 2; shiftX = m; pose(0, .2, 0, false, false); if(hitsText()) lo = m; else hi = m; }
  shiftX = hi;

/* 資料夾的姿勢：p 是捲動進度，px、py 是游標位置；smooth 為真時每格往目標靠一點，為假時直接擺到目標（量測用） */
function pose(p, px, py, inside, smooth){
  const base = root.userData.base || tmp.set(0, 0, 0), C = CFG;
  root.position.set(base.x + shiftX, base.y + p * .9, base.z);
  root.rotation.set(C.rx + p * .34 + py * .06, C.ry + px * .18 - p * .22, C.rz + px * .025);
  /* 頁的角度：一疊頁平均分布在 A0 到 A1，游標附近的頁會被撐開，像用手指翻檔案；

  const A0 = lerp(C.a0, C.a0o, p) * Math.PI, A1 = lerp(C.a1, C.a1o, p) * Math.PI;
  const fc = (px + 1) / 2;
  for(let i = 0; i < N; i++){
    const P = pages[i];
    let f = (i + .5) / N;
    const d = f - fc;
    f += .55 * d * Math.exp(-(d * d) / (2 * .018)) * (inside ? 1 : .35);
    f = Math.min(1, Math.max(0, f));
    const target = lerp(A0, A1, f);
    P.a = smooth ? P.a + (target - P.a) * .1 : target;
    P.piv.rotation.set(0, -P.a, (f - .5) * C.fanZ * (1 + p * .8));
    P.piv.position.set(0, -PH / 2, i * .004);
  }
  front.rotation.y = -lerp(.9, .965, p) * Math.PI;
  back.rotation.y = -(A1 + .05 * Math.PI);
}
const lerp = (a, b, t) => a + (b - a) * t;
/* 任何一格畫壞就收掉三維、換回平面頁扇，不留一片空白 */
function frame(now){
  raf = requestAnimationFrame(frame);
  if(!vis || document.hidden) return;
  try{ step(now); }catch(err){
    console.warn('三維頁扇出錯，改用平面頁扇', err);
    window.FITBOOT.mark('gl', '—');
    const h = host; API.unmount(); if(h) h.classList.remove('gl'); window.FITGL = null;
  }
}
function step(now){
  const t = F.RM ? 2 : (now - t0) / 1000;
  ptr.x += (ptr.tx - ptr.x) * .06; ptr.y += (ptr.ty - ptr.y) * .06;
  prog += ((F.heroP || 0) - prog) * .3;   /* 每格追上剩餘差距的三成：捲動停下後約 0.2 秒收完，不拖拍 */
  const p = F.RM ? .25 : prog, C = CFG;
  pose(p, ptr.x, ptr.y, ptr.inside, true);
  /* 彎度照頁序遞增：最前面那張最平、最後面那張最彎，一疊頁的弧度有順序 */
  pages.forEach((P, i) => {
    P.m.uniforms.uTime.value = t;
    P.m.uniforms.uCurl.value = C.curl * (.8 + .4 * i / (N - 1)) + p * .2;
  });
  pool.material.uniforms.uTime.value = t;
  R.render(scene, cam);
  window.FITBOOT.mark('gl');   /* 第一格畫出來才算三維載完；之後每格呼叫都會被略過 */
  overlays();
}
/* 手機上大標籤不准壓到首屏副標的任何一行字：旋轉後的標籤與字框相交就往右推，推到剛好不碰 */
function sat(A, B){
  const axes = ps => ps.map((p, i) => { const q = ps[(i + 1) % ps.length]; return [p[1] - q[1], q[0] - p[0]]; });
  const span = (ps, ax) => { let lo = Infinity, hi = -Infinity; ps.forEach(p => { const v = p[0] * ax[0] + p[1] * ax[1]; lo = Math.min(lo, v); hi = Math.max(hi, v); }); return [lo, hi]; };
  return [...axes(A), ...axes(B)].every(ax => { const a = span(A, ax), b = span(B, ax); return a[1] > b[0] + 2 && b[1] > a[0] + 2; });
}
function clearOfText(ax, ay, rad, w, h){
  const L = F.subLines;
  if(!L || !L.length || host.clientWidth > 820) return 0;
  const dy = -(F.heroP || 0) * F.TITLE_DROP * innerHeight, c = Math.cos(rad), s = Math.sin(rad);
  const boxes = L.map(r => [[r.l - 6, r.t + dy], [r.r + 6, r.t + dy], [r.r + 6, r.b + dy], [r.l - 6, r.b + dy]]);
  for(let dx = 0; dx <= 240; dx += 4){
    const P = [[0, 0], [w, 0], [w, h], [0, h]].map(([px, py]) => [ax + dx + px * c - py * s, ay + px * s + py * c]);
    if(!boxes.some(b => sat(P, b))) return dx;
  }
  return 0;
}
/* 把三維空間裡的幾個點投影到螢幕，讓直式標籤和錨點方塊黏在頁上 */
function proj(obj, x, y, z){
  tmp.set(x, y, z); obj.localToWorld(tmp); tmp.project(cam);
  return [(tmp.x + 1) / 2 * host.clientWidth, (1 - tmp.y) / 2 * host.clientHeight];
}
function overlays(){
  /* 大標籤黏在中段那張頁的上緣；兩張小標籤接在大標籤左下角下面，跟著它走 */
  const tags = F.tags || [];
  const mid = pages[Math.floor(N * .6)], gp = mid.mesh.geometry.parameters;
  const place = (el, x, y, rot) => { if(el) el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`; };
  if(tags[0]){
    const [x0, y0] = proj(mid.mesh, gp.width * .5, gp.height * .97, 0);
    const rot = -18 + ptr.x * 3, rad = rot * Math.PI / 180, h0 = tags[0].offsetHeight, w0 = tags[0].offsetWidth;
    let ax = x0 - w0 / 2;
    const ay = y0 - h0 * .12;
    ax += clearOfText(ax, ay, rad, w0, h0);
    place(tags[0], ax, ay, rot);
    const bx = ax - h0 * Math.sin(rad), by = ay + h0 * Math.cos(rad);
    if(tags.length === 3){
      const wa = tags[1].offsetWidth;
      place(tags[1], bx - wa * .2, by + 6, -3);
      place(tags[2], bx + wa * .85 + 6, by + 24, -2 + ptr.x * 1.5);
    } else if(tags[1]) place(tags[1], bx, by + 8, -3);
  }
  const lp = pages[N - 1].mesh.geometry.parameters;
  const pts = [proj(front, CW, -CH / 2, 0), proj(front, CW * .59, CH / 2 + .34, 0), proj(pages[N - 1].mesh, lp.width, lp.height, 0), proj(root, 0, -PH / 2, 0)];
  pts.forEach((xy, k) => { if(handles[k]) handles[k].style.transform = `translate(${xy[0].toFixed(1)}px,${xy[1].toFixed(1)}px)`; });
}
function onMove(e){
  const r = host.getBoundingClientRect();
  ptr.px = (e.clientX - r.left) / r.width; ptr.py = (e.clientY - r.top) / r.height;
  ptr.tx = ptr.px * 2 - 1; ptr.ty = ptr.py * 2 - 1;
  ptr.inside = ptr.px >= 0 && ptr.px <= 1 && ptr.py >= 0 && ptr.py <= 1;
}
function onLeave(){ ptr.inside = false; ptr.tx = .2; ptr.ty = 0; }

const API = {
  mount(el){
    try{ if(!R) init(); }catch(err){ console.warn('WebGL 不可用，改用平面頁扇', err); R = null; window.FITGL = null; window.FITBOOT.mark('gl', '—'); return; }
    host = el;
    host.appendChild(R.domElement);
    host.classList.add('gl');
    handles = [0, 1, 2, 3].map(() => { const h = document.createElement('i'); h.className = 'vh'; host.appendChild(h); return h; });
    resize();
    roV = new ResizeObserver(resize); roV.observe(host);
    ioV = new IntersectionObserver(es => { vis = es[0].isIntersecting; if(!vis) window.FITBOOT.mark('gl', '—'); }); ioV.observe(host);
    window.addEventListener('pointermove', onMove, {passive: true});
    host.addEventListener('pointerleave', onLeave);
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  },
  unmount(){
    cancelAnimationFrame(raf); raf = 0; vis = false;
    if(roV) roV.disconnect(); if(ioV) ioV.disconnect();
    window.removeEventListener('pointermove', onMove);
    if(host) host.removeEventListener('pointerleave', onLeave);
    if(R && R.domElement.parentNode) R.domElement.parentNode.removeChild(R.domElement);
    handles.forEach(h => h.remove()); handles = [];
    host = null;
  },
};
API.refit = () => { if(host && R) arrange(); };
API.fitInfo = () => {
  pose(0, .2, 0, false, false);
  const H = pagesHull(), xs = H.map(p => p[0]), ys = H.map(p => p[1]);
  return {shiftX: +shiftX.toFixed(3), clear: !hitsText(), prog: +prog.toFixed(4), box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)].map(Math.round), W: host.clientWidth, H: host.clientHeight};
};
window.FITGL = API;
if(F.pendingHost && document.body.contains(F.pendingHost)){ const h = F.pendingHost; F.pendingHost = null; API.mount(h); }
